<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Test Necken Lite</title></head>
<body>
<pre id="autotest-result">läuft …</pre>
<iframe id="f" style="width:1000px;height:600px;border:0"></iframe>
<script>
/* Mau-Mau Flip (Beta 1.6.3, Easter Eggs Teil 2 „Necken“, docs/module/eastereggs2.md): der echte Lite-Ablauf (index.html im iframe) gegen
 * einen Schein-WebSocket. Geprüft: fx_pref nach welcome und bei Änderung, Regeln (Spiegel von TeaseRules), Kopf-Tipp → Menü (ausgegraut
 * vor 10 s, Hinweise), Senden von Kugel/Schnarchen/Reaktion, Empfang fx → Effekte und Töne je Rolle (Ziel laut, Absender leise,
 * Zuschauer still bzw. Plopp leise), Reaktionstöne gedeckelt, Wecker abstellen, fx_no (late/busy/rate), fx_offs, „seats“ räumt ab,
 * kaputte Nachrichten und fx in der Lobby schadlos, Necken aus, alter Gastgeber ohne fx (nichts passiert, kein Fehler).
 * Beta 1.6.5: vier direkte Reaktionsknöpfe (Reihenfolge, ein Tipp sendet genau diese Reaktion, grau in der Sperrzeit, nicht in Phasen
 * ohne Reaktionen, bei Necken aus und über Farbrad/Fenster), Lage quer, Schrift sehr groß, großer Modus und hochkant (unter dem Tisch).
 * Beta 1.6.7: Menü schließt erst nach 15 s, bleibt bei Zugwechsel und Erwischen offen (springt nicht), „Erwischt!“-Buzzer rund, groß,
 * mit Namen, neben dem Mau-Knopf frei, durch das Menü hindurch drückbar (Loch), reduziert ohne Pulsieren; Rundenende schließt.
 * Beta 1.6.8: Furzkissen-Sperre mit Restdauer left (Bestätigung, fx_no rate): grau bis zum echten Ende, ohne Zahl; ohne left wie bisher.
 * Beta 1.6.10: Furzkissen als zwei runde Knöpfe „Kissen geheim“/„Kissen mit Namen“ (Tipp aufs Kissenbild legt sofort), eine Reihe am
 *   Computergegner, zwei an Menschen; alle Menüknöpfe ≥ 44 px, im Fenster, ohne Überschneidung (quer, Schrift groß/sehr groß, großer
 *   Modus, hochkant).
 * Aufruf: chrome --headless=new --allow-file-access-from-files --virtual-time-budget=300000 --dump-dom file:///…/webclient/test/lite_necken.html
 *   → <pre id="autotest-result" data-ok="1|0">. Läuft im Bau (tools/build.ps1 Invoke-WebTeaseTest). */
(function () {
  const fehler = [];
  const ok = (b, t) => { if (!b) fehler.push(t); };
  const warte = ms => new Promise(r => setTimeout(r, ms));
  const frame = document.getElementById('f');
  let w = null;
  const sockets = [];
  class FakeWS {
    constructor(url) { this.url = url; this.readyState = 0; this.gesendet = []; sockets.push(this); setTimeout(() => { this.readyState = 1; if (this.onopen) this.onopen(); }, 5); }
    send(s) { this.gesendet.push(s); let m = null; try { m = JSON.parse(s); } catch (e) { /* Text */ } if (m && m.t === 'ping') setTimeout(() => this.rx({ t: 'pong', ts: m.ts }), 2); }
    close() { this.readyState = 3; }
    rx(obj) { if (this.readyState === 1 && this.onmessage) this.onmessage({ data: JSON.stringify(obj) }); }
    msgs(t) { return this.gesendet.map(s => { try { return JSON.parse(s); } catch (e) { return {}; } }).filter(m => m.t === t); }
  }
  const letzter = () => sockets[sockets.length - 1];
  const leeren = () => { localStorage.clear(); localStorage.setItem('mmf.sprache', '"de"'); };
  const $ = s => w.document.querySelector(s);
  const toasts = () => Array.from(w.document.querySelectorAll('#toasts .toast')).map(t => t.textContent);
  let toene = [], vib = [];

  function lade(zusatz) {
    return new Promise(fertig => {
      frame.onload = async () => {
        w = frame.contentWindow;
        for (let i = 0; i < 100 && !(w.MMF && w.MMF.App && w.MMF.App.hostBasis); i++) await warte(20);
        w.WebSocket = FakeWS;
        toene = []; vib = [];
        w.MMF.Ton.spiele = (n, p) => { toene.push([n, p === undefined ? 1 : p]); return true; };   // Töne zählen (ohne Audio)
        w.MMF.Ton.stoppe = n => { toene.push(['stopp:' + n, 0]); return 1; };
        try { Object.defineProperty(w.navigator, 'vibrate', { configurable: true, value: m => { vib.push(m); return true; } }); } catch (e) { /* egal */ }
        fertig();
      };
      frame.src = '../index.html' + (zusatz || '');
    });
  }
  async function beitreten(name) {
    sockets.length = 0;
    w.MMF.App.beitreten(name);
    await warte(50);
    const s = letzter();
    s.rx({ t: 'welcome', id: 3, token: 'tok123abc', host_name: 'Lena' });
    await warte(20);
    return s;
  }
  // Sicht: ich Platz 0 (web), Lena 1 (app), Tom 2 (Computer), Mia 3 (web); Rückseiten verdeckt
  function sicht(turn, extra) {
    const v = {
      v: 1, seat: 0, side: 'hell', phase: 'turn', turn, dir: 1, color: 'rot',
      players: [['Kim', 'web'], ['Lena', 'app'], ['Tom', 'bot'], ['Mia', 'web']].map(([name, kind], s) => ({ seat: s, name, kind, count: s === 1 ? 1 : 7, backs: [], place: 0, mau: false, connected: true, score: 0 })),
      hand: [1, 2, 3, 4, 5, 6, 7].map(i => ({ id: i, face: 'hell_blau_' + i })), top: { id: 50, face: 'hell_rot_5' }, discard_log: [], draw_back: 'rueckseite', draw_count: 40,
      pending: null, hints: { playable: [], text: turn === 0 ? 'Du bist dran.' : 'Lena ist dran.', catch: [] }, round: 1, ranking: [],
      rules: { backs_visible: false, peek_own_backs: false, mau_call: 'catch' },
    };
    return Object.assign(v, extra || {});
  }
  const kopf = seat => $('#tisch .gg[data-seat="' + seat + '"] .kopf');
  const sichtbar = e => !!e && !e.hidden && e.getBoundingClientRect().width > 0;
  const N = () => w.MMF.Necken;
  // Beta 1.6.5: Reaktionsleiste
  const REIHE = ['lachen', 'klatschen', 'daumen', 'schreck'];
  const rb = r => $('#nk-leiste button[data-r="' + r + '"]');
  const ueberR = (a, b) => a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
  // Jeder Knopf mindestens 44 px, ganz im Fenster, über nichts Wichtigem (Hand nur, soweit sie im Tisch sichtbar ist)
  function pruefeLage(name) {
    const tisch = $('#tisch').getBoundingClientRect(), vw = w.innerWidth, vh = w.innerHeight;
    const schnitt = r => { const l = Math.max(r.left, tisch.left), t = Math.max(r.top, tisch.top), rr = Math.min(r.right, tisch.right), bb = Math.min(r.bottom, tisch.bottom); return rr > l && bb > t ? { left: l, top: t, right: rr, bottom: bb } : null; };
    const hind = [];
    ['#sortieren', '#rueckseiten', '#mau', '#stapel', '#ablage', '#tisch .leiste .hinweis', '#ich-zahl', '#tisch .menue-knopf', '#ton-knopf'].forEach(sel => { const e = $(sel); if (e && !e.hidden && e.getBoundingClientRect().width) hind.push([sel, e.getBoundingClientRect()]); });
    w.document.querySelectorAll('#tisch .hk').forEach((e, i) => { const r = schnitt(e.getBoundingClientRect()); if (r) hind.push(['Handkarte ' + i, r]); });
    // Großer Modus: Liegt die Leiste in der eigenen Zeile (lage=zeile), zählen dort nur das Wort „Du“ und die Kartenzahl
    const inZeile = App().tisch.gross && $('#nk-leiste').dataset.lage === 'zeile';
    if (App().tisch.gross) w.document.querySelectorAll('#tisch .gg:not(.aus)').forEach(e => {
      if (inZeile && e.classList.contains('ich')) {
        const rg = w.document.createRange(); rg.selectNodeContents(e.querySelector('.name'));
        hind.push(['„Du“', rg.getBoundingClientRect()], ['eigene Kartenzahl', e.querySelector('.zahl').getBoundingClientRect()]);
      } else hind.push(['Zeile ' + e.dataset.seat, e.getBoundingClientRect()]);
    });
    const L0 = $('#nk-leiste'), tx = parseFloat(L0.style.getPropertyValue('--nk-tx')) || 0, ty = parseFloat(L0.style.getPropertyValue('--nk-ty')) || 0;
    REIHE.forEach(r => {
      const b = rb(r), L = $('#nk-leiste').getBoundingClientRect();   // ohne Transform (Einblenden läuft unter virtueller Zeit nicht ab)
      const k = { left: L.left + b.offsetLeft, top: L.top + b.offsetTop, right: L.left + b.offsetLeft + b.offsetWidth, bottom: L.top + b.offsetTop + b.offsetHeight, width: b.offsetWidth, height: b.offsetHeight };
      // Trefferfläche: Knopf plus unsichtbarer Rand (::before, --nk-tx/--nk-ty); sichtbar mindestens 36 px; waagerecht in der
      // Zeile „Du“ (großer Modus, knapper Platz) reicht Knopf + Abstand ≥ 42 px (≈ 44, die Ränder links und rechts sind frei)
      ok(k.width + 2 * tx >= (inZeile ? 42 : 44) && k.height + 2 * ty >= 44 && k.width >= 36, name + ': ' + r + ' Trefferfläche mindestens 44 px (' + k.width + ' + 2 × ' + tx + ')');
      ok(k.left >= 0 && k.top >= 0 && k.right <= vw && k.bottom <= vh, name + ': ' + r + ' im Fenster');
      hind.forEach(([sel, h]) => { if (sel === '#ich-zahl' && App().tisch.gross) return; ok(!ueberR(k, h), name + ': ' + r + ' verdeckt ' + sel + ' nicht'); });
    });
  }
  const App = () => w.MMF.App;
  // Beta 1.6.10: Necken-Menü an einem Platz – jeder sichtbare Knopf (auch die beiden Kissen-Knöpfe) mindestens 44 px, ganz im
  // Fenster, keine Überschneidung; Computergegner eine Reihe, Menschen zwei (ohne Transform: Aufspringen läuft virtuell nicht ab)
  async function pruefeMenue(name, seat) {
    // App.einstellen öffnet das Einstellungsfenster; offene Fenster schließen das Necken-Menü im 400-ms-Takt (je nach Last
    // innerhalb der 60 ms unten – im Bau war der Test deshalb wackelig)
    App().schliesse('menue');
    N().oeffne(seat);
    await warte(60);
    const m = $('#nk-menue'), ml = parseFloat(m.style.left) || 0, mt = parseFloat(m.style.top) || 0, vw = w.innerWidth, vh = w.innerHeight;
    // gesetzte Lage statt getBoundingClientRect (Aufspringen und Mitgleiten laufen unter virtueller Zeit nicht ab)
    const mr = { left: ml, top: mt, right: ml + m.offsetWidth, bottom: mt + m.offsetHeight };
    const bot = (App().view.players.find(p => p.seat === seat) || {}).kind === 'bot';
    ok(sichtbar(m) && mr.left >= 0 && mr.top >= 0 && mr.right <= vw + 0.5 && mr.bottom <= vh + 0.5, name + ': Menü ganz im Fenster (' + JSON.stringify([mr.left, mr.top, mr.right, mr.bottom].map(Math.round)) + ')');
    const kn = Array.from(m.querySelectorAll('.nk-reihen button')).filter(b => !b.hidden && b.offsetWidth > 0);
    const kk = kn.filter(b => b.dataset.kissen);
    ok(kk.length === 2, name + ': beide Kissen-Knöpfe sichtbar');
    const box = b => { const L = mr; let x = 0, y = 0, e = b; while (e && e !== m) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; } return { left: L.left + x, top: L.top + y, right: L.left + x + b.offsetWidth, bottom: L.top + y + b.offsetHeight }; };
    kn.forEach((b, i) => {
      const r = box(b), was = b.dataset.kissen || b.dataset.k;
      ok(b.offsetWidth >= 44 && b.offsetHeight >= 44, name + ': ' + was + ' mindestens 44 px (' + b.offsetWidth + '×' + b.offsetHeight + ')');
      ok(r.left >= 0 && r.top >= 0 && r.right <= vw + 0.5 && r.bottom <= vh + 0.5, name + ': ' + was + ' im Fenster');
      kn.slice(i + 1).forEach(c => ok(!ueberR(r, box(c)), name + ': ' + was + ' überdeckt ' + (c.dataset.kissen || c.dataset.k) + ' nicht'));
    });
    ok(m.classList.contains('eine-reihe') === bot, name + ': ' + (bot ? 'eine Reihe am Computergegner' : 'zwei Reihen an Menschen'));
    N().zu();
  }

  async function lauf() {
    leeren();
    await lade('');
    const App = w.MMF.App;
    ok(App.version === '1.6.10', 'Version 1.6.10 (' + App.version + ')');
    ok(!!N() && App.einstellungen.necken === true, 'necken.js geladen, Necken ab Werk an');
    let s = await beitreten('Kim');
    ok(JSON.stringify(s.msgs('fx_pref')) === '[{"t":"fx_pref","off":false}]', 'fx_pref nach welcome (' + JSON.stringify(s.msgs('fx_pref')) + ')');
    // fx in der Lobby: verworfen
    s.rx({ t: 'fx', k: 'react', from: 1, r: 'lachen' });
    await warte(20);
    ok(N().gezeigt.length === 0, 'fx in der Lobby verworfen');
    s.rx({ t: 'start', seat: 0 });
    s.rx({ t: 'state', events: [], view: sicht(1) });
    await warte(400);
    // Beta 1.6.5: vier Reaktionsknöpfe direkt sichtbar (kein Lachgesicht-Knopf, kein Fächer), Reihenfolge Lachen, Klatschen, Daumen, Schreck
    ok(App.screen === 'tisch' && sichtbar($('#nk-leiste')) && REIHE.every(r => sichtbar(rb(r))), 'am Tisch: vier Reaktionsknöpfe sichtbar');
    ok(!$('#nk-reaktion') && !$('#nk-faecher'), 'kein Lachgesicht-Knopf und kein Fächer mehr');
    ok(JSON.stringify(Array.from(w.document.querySelectorAll('#nk-leiste button[data-r]')).map(b => b.dataset.r)) === JSON.stringify(REIHE), 'Reihenfolge Lachen, Klatschen, Daumen hoch, Schreck');
    ok(JSON.stringify(Array.from(w.document.querySelectorAll('#nk-leiste button[data-r] span')).map(b => b.textContent)) === '["😂","👏","👍","😱"]', 'Symbole 😂 👏 👍 😱 (Rückfall ohne Bild)');
    // Nutzer 15.10.2026: Fluent-Emoji-Bilder wie in der App (bilder/reaktionen/<name>.svg), geladen und sichtbar, das Schrift-Emoji dann verborgen
    {
      const bilder = REIHE.map(r => rb(r).querySelector('img.nk-ri'));
      ok(bilder.every((b, i) => b && /bilder\/reaktionen\/(\w+)\.svg$/.test(b.src) && b.src.endsWith(REIHE[i] + '.svg')), 'Reaktionsknöpfe zeigen bilder/reaktionen/<name>.svg');
      ok(bilder.every(b => b.complete && b.naturalWidth > 0 && b.offsetWidth >= 28), 'Reaktionsbilder geladen (' + bilder.map(b => b && b.naturalWidth + '/' + b.offsetWidth).join(', ') + ')');
      ok(REIHE.every(r => w.getComputedStyle(rb(r).querySelector('span')).display === 'none'), 'mit Bild kein zusätzliches Schrift-Emoji');
    }
    await warte(500);   // Einblenden der Knöpfe (nkRbAuf) abwarten
    pruefeLage('quer');
    // Gerätetest 1.6.3: Reaktionsknöpfe nicht über dem Farbrad bzw. einem Fenster (Menü); dort ohne Wirkung
    {
      const unsichtbar = e => !sichtbar(e) || w.getComputedStyle(e).visibility === 'hidden';
      App.tisch.oeffneFarbwahl('hell', {}, () => {});
      N()._takt();
      ok(REIHE.every(r => unsichtbar(rb(r))), 'Farbrad offen: Reaktionsknöpfe weg');
      rb('lachen').click();
      ok(s.msgs('fx').length === 0, 'Farbrad offen: Reaktionsknopf schickt nichts');
      App.tisch.schliesseFarbwahl();
      N()._takt();
      ok(!unsichtbar(rb('lachen')), 'Farbrad zu: Reaktionsknöpfe wieder da');
      App.oeffne('menue');
      N()._takt();
      ok(unsichtbar(rb('daumen')), 'Menü offen: Reaktionsknöpfe verdeckt');
      rb('daumen').click();
      ok(s.msgs('fx').length === 0, 'Menü offen: Reaktionsknopf schickt nichts');
      App.schliesse('menue');
      N()._takt();
      ok(!unsichtbar(rb('daumen')), 'Menü zu: Reaktionsknöpfe wieder da');
    }
    // Kopf-Tipp → Menü: Titel, Kugel aktiv, Schnarchen/Wecker vor 10 s ausgegraut mit Hinweis
    kopf(1).click();
    await warte(30);
    const m = $('#nk-menue');
    ok(sichtbar(m), 'Kopf-Tipp öffnet das Necken-Menü');
    ok(m.querySelector('.nk-titel').textContent === 'Lena · 1 Karte', 'Titel „Lena · 1 Karte“ (' + m.querySelector('.nk-titel').textContent + ')');
    const knopf = k => m.querySelector('button[data-k="' + k + '"]');
    ok(!knopf('ball').hidden && !knopf('ball').classList.contains('grau'), 'Papierkugel aktiv');
    ok(!knopf('snore').hidden && knopf('snore').classList.contains('grau') && !knopf('alarm').hidden && knopf('alarm').classList.contains('grau'), 'Schnarchen/Wecker vor 10 s ausgegraut');
    ok(m.querySelector('.nk-info').textContent === 'Erst, wenn Lena eine Weile überlegt.', 'Hinweis „Erst, wenn …“ (' + m.querySelector('.nk-info').textContent + ')');
    ok(knopf('ansehen').hidden, 'ohne sichtbare Rückseiten kein „Karten ansehen“');
    knopf('snore').click();
    await warte(20);
    ok(s.msgs('fx').length === 0, 'ausgegrautes Schnarchen schickt nichts');
    knopf('ball').click();
    await warte(20);
    ok(JSON.stringify(s.msgs('fx')) === '[{"t":"fx","k":"ball","to":1}]' && !sichtbar(m), 'Papierkugel geschickt, Menü zu (' + JSON.stringify(s.msgs('fx')) + ')');
    ok(!$('#tisch .nk-kugel'), 'Effekt erst mit dem fx des Gastgebers');
    s.rx({ t: 'fx', k: 'ball', from: 0, to: 1 });
    await warte(60);
    ok(!!$('#tisch .nk-kugel') && N().gezeigt.slice(-1)[0].rolle === 'absender', 'fx → Kugel fliegt (Absender)');
    ok(toene.some(t => t[0] === 'papier_wurf' && t[1] === 1) && !toene.some(t => t[0] === 'papier_plopp'), 'Absender: Wurf normal, kein Plopp (' + JSON.stringify(toene) + ')');
    await warte(900);
    ok(w.document.querySelectorAll('#tisch .nk-kugel').length === 1, 'Kugel liegt am Ziel');
    await warte(3600);
    ok(!$('#tisch .nk-kugel'), 'Kugel nach 3 s weg');
    // Zuschauer: Kugel von Mia an Tom (Computer) → Plopp leise, „Mpf!“
    toene = [];
    s.rx({ t: 'fx', k: 'ball', from: 3, to: 2 });
    await warte(900);
    ok(toene.some(t => t[0] === 'papier_plopp' && t[1] === 0.25) && !toene.some(t => t[0] === 'papier_wurf'), 'Zuschauer: Plopp leise (' + JSON.stringify(toene) + ')');
    ok(!!$('#tisch .nk-mpf'), 'Computergegner: „Mpf!“');
    // Ziel: Kugel an mich → Plopp normal, Vibration, Zeile
    toene = []; vib = [];
    s.rx({ t: 'fx', k: 'ball', from: 1, to: 0 });
    await warte(900);
    ok(toene.some(t => t[0] === 'papier_plopp' && t[1] === 1) && vib.some(v => v === 40), 'Ziel: Plopp normal und Vibration (' + JSON.stringify(toene) + ' ' + JSON.stringify(vib) + ')');
    ok(($('.nk-zeile') || {}).textContent === 'Papierkugel von Lena!', 'Ziel: „Papierkugel von Lena!“');
    // nach 10 s: Schnarchen geht, einmal je Zug
    await warte(5200);
    kopf(1).click();
    await warte(30);
    ok(!knopf('snore').classList.contains('grau') && $('#nk-menue .nk-info').hidden, 'nach 10 s: Schnarchen aktiv, kein Hinweis');
    knopf('snore').click();
    await warte(20);
    ok(s.msgs('fx').slice(-1)[0].k === 'snore' && s.msgs('fx').slice(-1)[0].to === 1, 'Schnarchen geschickt');
    toene = [];
    s.rx({ t: 'fx', k: 'snore', from: 0, to: 1 });
    await warte(40);
    ok(!!$('#tisch .nk-zzz') && !!$('#tisch .nk-muetze'), 'Schnarchen: Z z z und Mütze');
    ok(toene.some(t => t[0] === 'schnarchen' && t[1] === 0.25), 'Absender hört Schnarchen leise');
    ok(N().pruefe({ k: 'snore', to: 1 }) === 'once' && N().pruefe({ k: 'alarm', to: 1 }) === 'busy', 'Spiegel: Schnarchen einmal je Zug, Wecker während der Weckaktion busy (' + N().pruefe({ k: 'alarm', to: 1 }) + ')');
    s.rx({ t: 'fx_no', why: 'busy' });
    await warte(20);
    ok(toasts().indexOf('Lena wird gerade schon geweckt.') >= 0, 'fx_no busy → leise Zeile (' + toasts().join(' | ') + ')');
    ok(!w.document.querySelector('#toasts .toast.fehler'), 'fx_no ist kein Fehler');
    // Lena spielt: Schnarchen blendet aus
    s.rx({ t: 'state', events: [{ e: 'draw', seat: 1, count: 1 }], view: sicht(1) });
    await warte(600);
    ok(toene.some(t => t[0] === 'stopp:schnarchen'), 'Ziel handelt: Schnarchen-Ton ausgeblendet');
    s.rx({ t: 'fx_no', why: 'late' });
    await warte(20);
    ok(toasts().indexOf('Zu spät – Lena hat schon gespielt.') >= 0, 'fx_no late → „Zu spät – Lena hat schon gespielt.“');
    // Zuschauer-Wecker an Lena, Lena handelt in den 3 s → fällt um, klingelt nicht
    toene = [];
    s.rx({ t: 'fx', k: 'alarm', from: 3, to: 1 });
    await warte(300);
    const wk = $('#tisch .nk-wecker');
    ok(!!wk, 'Wecker erscheint beim Zuschauer');
    s.rx({ t: 'state', events: [{ e: 'play', seat: 1, card: 60, face: 'hell_rot_7' }], view: sicht(2) });
    await warte(3500);
    ok(wk.classList.contains('faellt') && !wk.classList.contains('klingelt') && !toene.some(t => t[0] === 'wecker'), 'Wecker abgestellt: fällt um, kein Klingeln');
    // Wecker an mich: ich bin dran, Zeile, nach 3 s Klingeln laut + Vibration
    toene = []; vib = [];
    s.rx({ t: 'state', events: [], view: sicht(0) });
    await warte(300);
    s.rx({ t: 'fx', k: 'alarm', from: 1, to: 0 });
    await warte(100);
    ok(($('.nk-zeile') || {}).textContent === 'Lena hat dir einen Wecker gestellt!' && !!$('#tisch .nk-wecker.ziel'), 'Ziel: großer Wecker und Zeile');
    await warte(3100);
    ok(!!$('#tisch .nk-wecker.klingelt') && toene.some(t => t[0] === 'wecker' && t[1] === 1) && vib.some(v => Array.isArray(v) && v.length === 5), 'nach 3 s: Klingeln normal und Vibration 3 × 250 ms');
    // Reaktionen: mehrere schnell hintereinander, Töne höchstens 2 gleichzeitig
    toene = [];
    {
      // Beta 1.6.5: ein Tipp je Knopf schickt genau diese Reaktion, die Leiste bleibt stehen
      const vor = s.msgs('fx').length;
      REIHE.forEach(r => rb(r).click());
      await warte(20);
      const neu = s.msgs('fx').slice(vor);

      kopf(3).click();
      await warte(30);
      ok(kb('name').classList.contains('grau') && kb('geheim').classList.contains('grau') && m.querySelector('.nk-info').textContent === 'Erst, wenn Mia dran ist.\nDas Kissen muss sich erst wieder aufpusten.', 'Sperre: Kissen-Knöpfe grau, Hinweis ohne Restzeit (' + m.querySelector('.nk-info').textContent + ')');
      { const n = s.msgs('fx').length; kb('name').click(); await warte(20); ok(s.msgs('fx').length === n && kb('name').classList.contains('wackel'), 'Sperre: grauer Kissen-Knopf schickt nichts und wackelt'); }
      N().zu();
      // fremde Bestätigung (gehört nie hierher): verworfen
      const g0 = N().gezeigt.length, t0 = toasts().length;
      s.rx({ t: 'fx', k: 'kissen', from: 1, to: 3, reveal: true });
      await warte(30);
      ok(N().gezeigt.length === g0 && N().regeln.cushions[3] === undefined && toasts().length === t0, 'fremde Kissen-Bestätigung verworfen');
      // Pups beim Bot (geheim, Kopie des Legers mit from): leise, „Wer war das?“
      toene = []; vib = [];
      s.rx({ t: 'fx', k: 'kissen_pop', to: 2, reveal: false, from: 0 });
      await warte(60);
      const ki = $('#tisch .nk-furz');
      ok(!!ki && !ki.classList.contains('ziel') && !!ki.querySelector('.nk-pf') && ki.querySelector('.nk-pf').textContent === 'Pfffrt!' && w.document.querySelectorAll('#tisch .nk-furz .nk-wolke b').length === 4, 'Pups: Kissen, Wolke und „Pfffrt!“ am Platz des Ziels');
      await warte(200);
      ok(JSON.stringify(toene.filter(t => t[0] === 'furzkissen')) === '[["furzkissen",0.25]]' && vib.length === 0, 'Pups beim Mitspieler: Ton leise (auch beim Leger), keine Vibration (' + JSON.stringify(toene) + ')');
      ok(N().regeln.cushions[2] === undefined && N().pruefe({ k: 'kissen', to: 2 }) === 'rate', 'Pups räumt das Kissen im Spiegel ab, die Sperre bleibt');
      await warte(1400);
      ok(($('#tisch .nk-wer') || {}).textContent === 'Wer war das?', 'geheim: „Wer war das?“ – auch beim Leger (' + ($('#tisch .nk-wer') || {}).textContent + ')');
      await warte(1200);
      ok(!$('#tisch .nk-furz'), 'Kissen nach dem Pups wieder weg');
      // Pups bei mir (Ziel) mit Namen: groß, Ton normal, Vibration, Zeile „Lena war's!“
      toene = []; vib = [];
      s.rx({ t: 'fx', k: 'kissen_pop', to: 0, reveal: true, from: 1 });
      await warte(300);
      ok(!!$('#tisch .nk-furz.ziel') && JSON.stringify(toene.filter(t => t[0] === 'furzkissen')) === '[["furzkissen",1]]' && vib.indexOf(150) >= 0, 'Pups beim Ziel: groß, Ton normal, Vibration 150 ms (' + JSON.stringify(toene) + ' ' + JSON.stringify(vib) + ')');
      await warte(1300);
      ok(($('.nk-zeile') || {}).textContent === 'Lena war\'s!' && !$('#tisch .nk-wer'), 'Ziel: Zeile „Lena war\'s!“ über dem eigenen Namensschild');
      // Zuschauer: Pups bei Mia ohne from (geheim) → leise, „Wer war das?“; mit Namen → „Lena war's!“ als Schild
      toene = [];
      s.rx({ t: 'fx', k: 'kissen_pop', to: 3, reveal: true, from: 1 });
      await warte(1500);
      ok(($('#tisch .nk-wer') || {}).textContent === 'Lena war\'s!' && toene.some(t => t[0] === 'furzkissen' && t[1] === 0.25), 'Zuschauer: Schild „Lena war\'s!“, Ton leise');
      await warte(2800);
      // kaputte Kissen-Nachrichten
      const g1 = N().gezeigt.length;
      [{ t: 'fx', k: 'kissen_pop', to: 2, reveal: true }, { t: 'fx', k: 'kissen_pop', to: 2, reveal: 'ja' }, { t: 'fx', k: 'kissen_pop', to: 2, reveal: false, from: 2 },
        { t: 'fx', k: 'kissen_pop', to: 12, reveal: false }, { t: 'fx', k: 'kissen_pop', to: 2, reveal: false, from: null }, { t: 'fx', k: 'kissen', from: 0, to: 2 },
        { t: 'fx', k: 'kissen', from: 0, to: 0, reveal: true }, { t: 'fx_no', why: 'quatsch', k: 'kissen' }].forEach(x => s.rx(x));
      await warte(300);
      ok(N().gezeigt.length === g1 && !$('#tisch .nk-furz'), 'kaputte Kissen-Nachrichten verworfen');
      // Ablehnungen mit k:"kissen": busy (fremdes Kissen bleibt grau) und rate (ohne Restzeit)
      N().regeln.cushionUntil = {};   // Sperre vorbei (statt 60 s zu warten)
      kopf(3).click();
      await warte(30);
      ok(!kb('name').classList.contains('grau') && m.querySelector('.nk-info').textContent === 'Erst, wenn Mia dran ist.', 'nach der Sperre: Kissen-Knöpfe wieder aktiv, nur der Hinweis zu Schnarchen/Wecker (1.6.7)');
      kb('name').click();
      await warte(20);
      ok(JSON.stringify(s.msgs('fx').slice(-1)) === '[{"t":"fx","k":"kissen","to":3,"reveal":true}]', 'Kissen „Mit Namen“ geschickt (reveal:true)');
      s.rx({ t: 'fx_no', why: 'busy', k: 'kissen' });
      await warte(20);
      ok(toasts().indexOf('Da liegt schon ein Kissen.') >= 0 && toasts().indexOf('Mia wird gerade schon geweckt.') < 0, 'fx_no busy mit k → „Da liegt schon ein Kissen.“');
      ok(N().pruefe({ k: 'kissen', to: 3 }) === 'busy' && N().pruefe({ k: 'kissen', to: 1 }) === '', 'nach busy: Kissen bei Mia bleibt grau, andere frei');
      kopf(3).click();
      await warte(30);
      ok(kb('geheim').classList.contains('grau') && m.querySelector('.nk-info').textContent === 'Erst, wenn Mia dran ist.\nDa liegt schon ein Kissen.', 'Menü: „Da liegt schon ein Kissen.“');
      N().zu();
      s.rx({ t: 'fx', k: 'kissen_pop', to: 3, reveal: false });
      await warte(30);
      ok(N().pruefe({ k: 'kissen', to: 3 }) === '', 'Pups bei Mia: Ziel wieder frei');
      s.rx({ t: 'fx_no', why: 'rate', k: 'kissen' });
      await warte(20);
      ok(toasts().indexOf('Das Kissen muss sich erst wieder aufpusten.') >= 0 && N().pruefe({ k: 'kissen', to: 1 }) === 'rate', 'fx_no rate mit k → „Das Kissen muss sich erst wieder aufpusten.“, Knopf grau');
      ok(!w.document.querySelector('#toasts .toast.fehler'), 'Kissen-Ablehnungen sind keine Fehler');
      await warte(2900);
      // Beta 1.6.8 (Nutzerbefund S10): Bestätigung mit left = Restdauer der eigenen Sperre – der Knopf bleibt die ganze Zeit grau,
      // ohne Zahl; fx_no rate mit left setzt die Sperre; ohne left (Gastgeber bis 1.6.7) wie bisher. Eigene Uhr, statt Minuten zu warten.
      {
        const uhr0 = N().uhr;
        let jetzt = 5000000;
        N().uhr = () => jetzt;
        N().regeln.cushionUntil = {}; N().regeln.cushions = {};
        s.rx({ t: 'fx', k: 'kissen', from: 0, to: 1, reveal: true, left: 150000 });
        await warte(20);
        ok(N().regeln.cushionUntil[0] === jetzt + 150000 && toasts().indexOf('Kissen liegt bei Lena.') >= 0, '1.6.8: Bestätigung mit left – Spiegel kennt die echte Sperre (' + (N().regeln.cushionUntil[0] - jetzt) + ')');
        jetzt += 61000;
        ok(N().pruefe({ k: 'kissen', to: 3 }) === 'rate', '1.6.8: bei 61 s noch gesperrt (früher frei)');
        kopf(3).click();
        await warte(30);
        const info = m.querySelector('.nk-info').textContent;
        ok(kb('name').classList.contains('grau') && kb('geheim').classList.contains('grau') && info === 'Erst, wenn Mia dran ist.\nDas Kissen muss sich erst wieder aufpusten.' && !/\d/.test(info), '1.6.8: bei 61 s Knöpfe grau, Hinweis ohne Zahl (' + info + ')');
        { const n = s.msgs('fx').length; kb('geheim').click(); await warte(20); ok(s.msgs('fx').length === n, '1.6.8: grauer Knopf schickt nichts'); }
        N().zu();
        jetzt += 88000;
        ok(N().pruefe({ k: 'kissen', to: 3 }) === 'rate', '1.6.8: bei 149 s noch gesperrt');
        jetzt += 2000;
        ok(N().pruefe({ k: 'kissen', to: 3 }) === '', '1.6.8: bei 151 s frei');
        kopf(3).click();
        await warte(30);
        ok(!kb('name').classList.contains('grau') && m.querySelector('.nk-info').textContent === 'Erst, wenn Mia dran ist.', '1.6.8: bei 151 s Knöpfe wieder aktiv');
        N().zu();
        // fx_no rate mit Restdauer (z. B. Spiegel nach Neuladen leer): grau genau so lange
        N().regeln.cushionUntil = {};
        s.rx({ t: 'fx_no', why: 'rate', k: 'kissen', left: 90000 });
        await warte(20);
        jetzt += 89000;
        ok(N().pruefe({ k: 'kissen', to: 3 }) === 'rate', '1.6.8: fx_no rate mit left – bei 89 s noch grau (früher nach 10 s frei)');
        jetzt += 2000;
        ok(N().pruefe({ k: 'kissen', to: 3 }) === '', '1.6.8: fx_no rate mit left – danach frei');
        // Gastgeber bis 1.6.7: Bestätigung ohne left → 60 s, fx_no rate ohne left → KISSEN_GRAU_MS (10 s)
        N().regeln.cushions = {};
        s.rx({ t: 'fx', k: 'kissen', from: 0, to: 1, reveal: false });
        await warte(20);
        ok(N().regeln.cushionUntil[0] === jetzt + 60000, '1.6.8: alter Gastgeber ohne left – Mindestzeit 60 s');
        N().regeln.cushionUntil = {}; N().regeln.cushions = {};
        s.rx({ t: 'fx_no', why: 'rate', k: 'kissen' });
        await warte(20);
        ok(N().regeln.cushionUntil[0] === jetzt + 10000, '1.6.8: alter Gastgeber, fx_no rate ohne left – wie bisher 10 s grau');
        // kaputtes left: Bestätigung gilt, Sperre wie ohne left
        N().regeln.cushionUntil = {};
        s.rx({ t: 'fx', k: 'kissen', from: 0, to: 2, reveal: false, left: 'lange' });
        await warte(20);
        ok(N().regeln.cushionUntil[0] === jetzt + 60000 && N().regeln.cushions[2] && N().regeln.cushions[2].from === 0, '1.6.8: kaputtes left – Bestätigung gilt, Mindestzeit');
        N().regeln.cushionUntil = {}; N().regeln.cushions = {};
        N().uhr = uhr0;
      }
      // Rundenende: offene Kissen verfallen still, die Sperre bleibt; seats leert beides
      N().regeln.cushionUntil = {};
      s.rx({ t: 'fx', k: 'kissen', from: 0, to: 1, reveal: true });
      await warte(20);
      s.rx({ t: 'state', events: [], view: sicht(1, { phase: 'round_over' }) });
      await warte(60);
      ok(Object.keys(N().regeln.cushions).length === 0 && N().regeln.cushionUntil[0] > 0, 'Rundenende: Kissen verfallen, Sperre bleibt');
      s.rx({ t: 'state', events: [], view: sicht(1) });
      await warte(60);
      ok(N().pruefe({ k: 'kissen', to: 1 }) === 'rate', 'neue Runde: Sperre gilt weiter');
      s.rx({ t: 'state', events: [{ e: 'seats', map: [0, 1, 2, 3], join: -1 }], view: sicht(1) });
      await warte(60);
      ok(N().pruefe({ k: 'kissen', to: 1 }) === '', 'seats: Sperre und Kissen geleert');
      // seats während des Pupses: Ton und Schild kommen nicht mehr
      toene = [];
      s.rx({ t: 'fx', k: 'kissen_pop', to: 2, reveal: false });
      await warte(30);
      s.rx({ t: 'state', events: [{ e: 'seats', map: [0, 1, 2, 3], join: -1 }], view: sicht(1) });
      await warte(1700);
      ok(!toene.some(t => t[0] === 'furzkissen') && !$('#tisch .nk-wer') && !$('#tisch .nk-furz'), 'seats während des Pupses: abgeräumt, kein Ton, kein Schild');
      // Necken aus beim Ziel: Kissen-Zeile weg
      s.rx({ t: 'fx_offs', seats: [2] });
      await warte(20);
      kopf(2).click();
      await warte(30);
      ok(reihe().hidden && m.querySelector('.nk-info').textContent === 'Tom möchte gerade nicht geneckt werden.', 'Necken aus beim Ziel: keine Kissen-Zeile');
      N().zu();
      s.rx({ t: 'fx_offs', seats: [] });
      // Effekte reduziert: Kissen blendet nur
      w.MMF.App.einstellungen.effekte = 'reduziert'; w.document.body.classList.add('reduziert');
      s.rx({ t: 'fx', k: 'kissen_pop', to: 1, reveal: false });
      await warte(60);
      ok(!!$('#tisch .nk-furz.still'), 'Effekte reduziert: Kissen ohne Plattdrücken (still)');
      w.MMF.App.einstellungen.effekte = 'voll'; w.document.body.classList.remove('reduziert');
      await warte(4300);
      // Necken aus an diesem Gerät: Pups weder sehen noch hören
      w.MMF.App.einstellen('necken', 'false');
      w.MMF.App.schliesse('menue');
      toene = [];
      s.rx({ t: 'fx', k: 'kissen_pop', to: 0, reveal: true, from: 1 });
      await warte(400);
      ok(!$('#tisch .nk-furz') && !toene.some(t => t[0] === 'furzkissen'), 'Necken aus: Pups weder sichtbar noch hörbar');
      ok(w.MMF.App.fehler.length === 0, 'Kissen: keine Fehler im Lite (' + w.MMF.App.fehler.join(' | ') + ')');
    }

    // Regeln (Spiegel von TeaseRules) direkt
    const R = new w.MMF.Necken.Regeln();
    const T = (turn, phase, offs) => w.MMF.Necken.Regeln.tischAusSicht(sicht(turn, { phase: phase || 'turn' }), offs || [], 'client');
    R.notiereZug(1, 'turn', 0);
    ok(R.pruefe(0, { k: 'snore', to: 1 }, T(1), 9999) === 'early' && R.pruefe(0, { k: 'snore', to: 1 }, T(1), 10000) === '', 'Regeln: Schnarchen ab 10 s');
    ok(R.pruefe(0, { k: 'snore', to: 2 }, T(2), 20000) !== '' && R.pruefe(0, { k: 'snore', to: 0 }, T(0), 20000) === 'self', 'Regeln: nie Computergegner, nie man selbst');
    R.verbuche({ k: 'alarm', from: 0, to: 1 }, 10000);
    ok(R.pruefe(3, { k: 'alarm', to: 1 }, T(1), 12000) === 'busy' && R.pruefe(3, { k: 'alarm', to: 1 }, T(1), 15000) === '' && R.pruefe(0, { k: 'alarm', to: 1 }, T(1), 15000) === 'once', 'Regeln: busy 5 s, je Sender einmal');
    R.notiereEreignisse([{ e: 'draw', seat: 1 }], 16000);
    ok(R.pruefe(3, { k: 'snore', to: 1 }, T(1), 20000) === 'early', 'Regeln: Aktion des Ziels setzt die Uhr zurück');
    R.notiereZug(2, 'turn', 21000);
    ok(R.pruefe(3, { k: 'snore', to: 1 }, T(2), 40000) === 'late', 'Regeln: nicht mehr am Zug → late');
    ok(R.pruefe(0, { k: 'ball', to: 1 }, T(1, 'round_over'), 40000) === 'phase' && R.pruefe(0, { k: 'react', r: 'daumen' }, T(1, 'round_over'), 40000) === '', 'Regeln: Rundenende nur Reaktionen');
    R.verbuche({ k: 'ball', from: 0, to: 1 }, 50000);
    ok(R.pruefe(0, { k: 'ball', to: 1 }, T(1), 51000) === 'rate' && R.pruefe(0, { k: 'ball', to: 3 }, T(1), 51000) === '', 'Regeln: Kugel-Abstand am Ziel');
    R.verbuche({ k: 'ball', from: 0, to: 3 }, 51000);
    ok(R.pruefe(0, { k: 'ball', to: 2 }, T(1), 52000) === 'rate' && R.pruefe(0, { k: 'ball', to: 2 }, T(1), 56000) === '', 'Regeln: Kugel-Eimer 2, +1 je 5 s');
    ok(R.pruefe(0, { k: 'ball', to: 1 }, T(1, 'turn', [1]), 90000) === 'off' && R.pruefe(1, { k: 'ball', to: 0 }, T(1, 'turn', [1]), 90000) === 'off', 'Regeln: Necken aus (Ziel oder Absender)');
    R.notiereEreignisse([{ e: 'seats', map: [0, 1] }], 91000);
    ok(R.turn === -1 && Object.keys(R.buckets).length === 0, 'Regeln: seats leert den Zustand');
    ok(JSON.stringify(w.MMF.Necken.Regeln.caps('pass').kinds) === '[]' && w.MMF.Necken.Regeln.caps('solo').bots_only === true, 'Regeln: caps');
    // Beta 1.6.6: Furzkissen im Spiegel
    {
      const K = new w.MMF.Necken.Regeln();
      K.notiereZug(1, 'turn', 0);
      ok(JSON.stringify(w.MMF.Necken.Regeln.caps('solo').kinds) === '["ball","kissen"]' && w.MMF.Necken.Regeln.caps('client').kinds.indexOf('kissen') >= 0, 'Regeln: caps mit Kissen (solo nur Bots)');
      ok(K.pruefe(0, { k: 'kissen', to: 2 }, T(1), 100) === '' && K.pruefe(0, { k: 'kissen', to: 1 }, T(1), 100) === '' && K.pruefe(0, { k: 'kissen', to: 0 }, T(1), 100) === 'self', 'Regeln: Kissen auf Bot und Spieler am Zug, nie auf sich selbst');
      ok(K.pruefe(0, { k: 'kissen', to: 2 }, T(1, 'round_over'), 100) === 'phase' && K.pruefe(0, { k: 'kissen', to: 1 }, T(1, 'turn', [1]), 100) === 'off' && K.pruefe(0, { k: 'kissen', to: 1 }, T(1, 'turn', [0]), 100) === 'off', 'Regeln: Kissen nur in der Runde, nicht bei Necken aus');
      K.verbuche({ k: 'kissen', from: 0, to: 2, reveal: true }, 1000);
      ok(Object.keys(K.buckets).length === 0 && K.pruefe(0, { k: 'kissen', to: 3 }, T(1), 60999) === 'rate' && K.pruefe(0, { k: 'kissen', to: 3 }, T(1), 61000) === '', 'Regeln: Kissen ohne Eimer, Mindestsperre 60 s');
      ok(K.pruefe(0, { k: 'kissen', to: 2 }, T(1), 61000) === 'busy', 'Regeln: eigenes Kissen liegt noch → busy');
      K.verbuche({ k: 'kissen_pop', to: 2, reveal: true, from: 0 }, 62000);
      ok(K.pruefe(0, { k: 'kissen', to: 2 }, T(1), 62000) === '' && Object.keys(K.buckets).length === 0, 'Regeln: Pups räumt ab, ohne Eimer');
      ok(w.MMF.Necken.CUSHION_BLOCK_MIN_MS === 60000 && w.MMF.Necken.CUSHION_BLOCK_MAX_MS === 180000 && JSON.stringify(w.MMF.Necken.CUSHION_TRIGGERS) === '["play","draw","accept","stake"]', 'Regeln: Kissen-Konstanten wie TeaseRules');
      const cf = w.MMF.Necken.cleanFx;
      ok(JSON.stringify(cf({ k: 'kissen_pop', to: 2, reveal: false, from: 0 })) === '{"t":"fx","k":"kissen_pop","to":2,"reveal":false,"from":0}' && JSON.stringify(cf({ k: 'kissen_pop', to: 2, reveal: false })) === '{"t":"fx","k":"kissen_pop","to":2,"reveal":false}'
        && cf({ k: 'kissen_pop', to: 2, reveal: true }) === null && JSON.stringify(cf({ k: 'kissen', from: 0, to: 2, reveal: true, x: 1 })) === '{"t":"fx","k":"kissen","from":0,"to":2,"reveal":true}', 'cleanFx: kissen/kissen_pop wie NetProtocol');
      ok(w.MMF.Necken.cleanFxNoKind({ why: 'busy', k: 'kissen' }) === 'kissen' && w.MMF.Necken.cleanFxNoKind({ why: 'busy' }) === '' && w.MMF.Necken.cleanFxNoKind({ why: 'busy', k: 'ball' }) === '', 'cleanFxNoKind wie NetProtocol.clean_fx_no_kind');
      // Beta 1.6.8: Restdauer left (wie NetProtocol.clean_cushion_left / clean_fx_no_left)
      ok(JSON.stringify(cf({ k: 'kissen', from: 0, to: 2, reveal: false, left: 150000 })) === '{"t":"fx","k":"kissen","from":0,"to":2,"reveal":false,"left":150000}'
        && cf({ k: 'kissen', from: 0, to: 2, reveal: false, left: 9999999 }).left === 180000 && cf({ k: 'kissen', from: 0, to: 2, reveal: false, left: -3 }).left === undefined
        && cf({ k: 'kissen', from: 0, to: 2, reveal: false, left: '9' }).left === undefined && cf({ k: 'kissen', from: 0, to: 2, reveal: false, left: 1234.6 }).left === 1235, 'cleanFx: left geklemmt, kaputt weg');
      const nr = w.MMF.Necken.cleanFxNoRest;
      ok(nr({ why: 'rate', k: 'kissen', left: 89000 }) === 89000 && nr({ why: 'rate', k: 'kissen' }) === -1 && nr({ why: 'busy', k: 'kissen', left: 5 }) === -1
        && nr({ why: 'rate', left: 5 }) === -1 && nr({ why: 'rate', k: 'kissen', left: NaN }) === -1, 'cleanFxNoRest wie NetProtocol.clean_fx_no_left');
      K.verbuche({ k: 'kissen', from: 0, to: 3, reveal: false, left: 150000 }, 100000);
      ok(K.pruefe(0, { k: 'kissen', to: 1 }, T(1), 249999) === 'rate' && K.pruefe(0, { k: 'kissen', to: 1 }, T(1), 250000) === '', 'Regeln: Bestätigung mit left sperrt genau so lange');
    }
  }
  lauf().then(() => {}, e => fehler.push('Ausnahme: ' + (e && e.stack || e))).then(() => {
    const el = document.getElementById('autotest-result');
    el.setAttribute('data-ok', fehler.length ? '0' : '1');
    el.textContent = fehler.length ? 'FEHLER: ' + fehler.join(' | ') : 'ok';
  });
})();
</script></body></html>
