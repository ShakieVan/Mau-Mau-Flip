<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Test Natur Lite</title></head>
<body>
<pre id="autotest-result">läuft …</pre>
<iframe id="f" style="width:844px;height:390px;border:0"></iframe>
<script>
/* Mau-Mau Flip (Beta 1.6.11, „Natur-Überraschungen“, docs/module/natur.md 8.2): der echte Lite-Ablauf (index.html?natur=test im iframe)
 * gegen einen Schein-WebSocket, Uhr manuell (MMF.Natur.tick), Arten als Probe (eine Art für alle ids), damit der Kern ohne die Tierdateien
 * (natur_tag.js / natur_nacht.js, Aufgaben T5/T6) prüfbar ist. Geprüft:
 *  - Tabelle (29 Einträge seit 1.6.15, ruhig, vorn), Ebenen (DOM-Reihenfolge, z-index, pointer-events, aria-hidden), ?natur=test/?natur=reihe
 *  - Planer im Dauerlauf (10 h, Lage eingespritzt): Abstände, nie zwei gleichzeitig, Wiederholungssperre, je_partie/je_runde, Seite,
 *    fremder Zug, Flip-Anlass (≤ 1 je Runde und Seite, ≥ 25 s), Trödeln, Komet-Sperre, jedes Zufallsereignis kommt vor
 *  - Bedingungen am echten Tisch: großer Modus, Fenster, Erwischt-Fenster, Phasen, Regie < 2 s ruhig, reduziert (nur ruhige, Abstände ×2),
 *    fremder Zug, Lobby, enges Fenster (hochkant)
 *  - Abgang und Abbruch nach 4.5, Schnecke beim Trödeln (verdrängt ein laufendes Ereignis, einmal je Spieler und Partie)
 *  - Tippen: Stapel unter dem UFO zieht (das UFO bleibt, nicht mehr scheu), Handkarte unter der Biene wird angetippt (Biene geht), Kopf
 *    öffnet das Necken-Menü, freie Stelle auf dem Spatz gibt eine Reaktion ohne App-Aktion; nie preventDefault; Vorführung per 7 Tipps
 *  - 1.6.15 mit den echten Arten: UFO weicht beim 1. und 2. Tipp aus, der 3. verscheucht es; Feuerwerk zündet an der Tippstelle (höchstens
 *    zweimal); Astronaut macht einen Salto; Hoppelhase springt erschrocken hoch; Palme schüttelt sich, eine Kokosnuss fällt; der Strand
 *    liegt hinter dem Mau-Knopf
 *  - generisch für jede angemeldete Art (MMF.Natur.arten()) in 1180×720, 1558×720 und 2000×720: Sichtbarkeit, deckt, Aufräumen,
 *    Bestimmtheit, schneller Abgang (≤ 0,5 s); zur Kontrolle des Prüfers auch mit der Probe
 *  - nichts nach außen: kein Ton, keine Vibration, nichts an den WebSocket aus natur*.js
 * Aufruf: chrome --headless=new --allow-file-access-from-files --virtual-time-budget=300000 --dump-dom file:///…/webclient/test/lite_natur.html
 *   → <pre id="autotest-result" data-ok="1|0">. Läuft im Bau (tools/build.ps1 Invoke-WebNatureTest). */
(function () {
  const fehler = [], notizen = [];
  const ok = (b, t) => { if (!b) fehler.push(t); };
  const warte = ms => new Promise(r => setTimeout(r, ms));
  const frame = document.getElementById('f');
  let w = null;
  const sockets = [];
  const ausNatur = () => /natur(_tag|_nacht)?\.js/.test(String(new Error().stack || ''));
  let natSenden = 0, natTon = 0, natVib = 0, natPrevent = 0;
  class FakeWS {
    constructor(url) { this.url = url; this.readyState = 0; this.gesendet = []; sockets.push(this); setTimeout(() => { this.readyState = 1; if (this.onopen) this.onopen(); }, 5); }
    send(s) { if (ausNatur()) natSenden++; this.gesendet.push(s); let m = null; try { m = JSON.parse(s); } catch (e) { /* Text */ } if (m && m.t === 'ping') setTimeout(() => this.rx({ t: 'pong', ts: m.ts }), 2); }
    close() { this.readyState = 3; }
    rx(obj) { if (this.readyState === 1 && this.onmessage) this.onmessage({ data: JSON.stringify(obj) }); }
  }
  const letzter = () => sockets[sockets.length - 1];
  const $ = s => w.document.querySelector(s);
  const App = () => w.MMF.App;
  const N = () => w.MMF.Natur;

  function lade(zusatz) {
    return new Promise(fertig => {
      frame.onload = async () => {
        w = frame.contentWindow;
        for (let i = 0; i < 100 && !(w.MMF && w.MMF.App && w.MMF.App.hostBasis); i++) await warte(20);
        w.WebSocket = FakeWS;
        w.MMF.Ton.spiele = () => { if (ausNatur()) natTon++; return true; };
        try { Object.defineProperty(w.navigator, 'vibrate', { configurable: true, value: () => { if (ausNatur()) natVib++; return true; } }); } catch (e) { /* egal */ }
        const pd = w.Event.prototype.preventDefault;
        w.Event.prototype.preventDefault = function () { if (ausNatur()) natPrevent++; return pd.call(this); };
        fertig();
      };
      frame.src = '../index.html' + (zusatz || '');
    });
  }
  async function groesse(b, h) { frame.style.width = b + 'px'; frame.style.height = h + 'px'; await warte(250); App().groesse(); await warte(50); }
  async function beitreten(name) {
    sockets.length = 0;
    App().beitreten(name);
    await warte(50);
    const s = letzter();
    s.rx({ t: 'welcome', id: 3, token: 'tok123abc', host_name: 'Lena' });
    await warte(20);
    return s;
  }
  let topId = 50;
  // Sicht: ich Platz 0 (web), Lena 1 (app), Tom 2 (Computer), Mia 3 (web)
  function sicht(turn, extra) {
    const v = {
      v: 1, seat: 0, side: 'hell', phase: 'turn', turn, dir: 1, color: 'rot',
      players: [['Kim', 'web'], ['Lena', 'app'], ['Tom', 'bot'], ['Mia', 'web']].map(([name, kind], s) => ({ seat: s, name, kind, count: 7, backs: [], place: 0, mau: false, connected: true, score: 0 })),
      hand: [1, 2, 3, 4, 5, 6, 7].map(i => ({ id: i, face: 'hell_blau_' + i })), top: { id: topId, face: 'hell_rot_5' }, discard_log: [], draw_back: 'rueckseite', draw_count: 40,
      pending: null, hints: { playable: [], text: turn === 0 ? 'Du bist dran.' : 'Lena ist dran.', catch: [] }, round: 1, ranking: [],
      rules: { backs_visible: false, peek_own_backs: false, mau_call: 'catch' },
    };
    return Object.assign(v, extra || {});
  }
  let S = null;   // Schein-WebSocket
  async function zustand(turn, extra, events) { S.rx({ t: 'state', events: events || [], view: sicht(turn, extra) }); await warte(350); }

  // Probe-Art: kleines Quadrat am Ort des Eintrags (UFO groß über dem Stapel, Biene auf der mittleren Handkarte)
  const PROBE = {
    baue(ctx, z) {
      const e = ctx.eintrag, d = e.dauer[0] + z() * (e.dauer[1] - e.dauer[0]);
      const el = w.document.createElement('div');
      el.className = 'nt-probe';
      let gw = 20, gh = 20, p = { x: ctx.W * 0.5, y: ctx.H * 0.15 };
      const o = ctx.ort;
      if (o && typeof o.grad === 'number') p = ctx.band(o.grad);
      else if (o && typeof o.x === 'number' && typeof o.y === 'number') p = { x: o.x, y: o.y };
      else if (o && typeof o.y0 === 'number') p = { x: ctx.W * (0.2 + 0.6 * z()), y: (o.y0 + o.y1) / 2 };
      else if (o && typeof o.cx === 'number') p = { x: o.cx, y: o.cy - (o.ry || o.r || 0) * 1.2 };
      if (ctx.id === 'biene') { const k = ctx.hand(); if (k) p = { x: k.x + k.w / 2 - 26, y: k.y - k.h / 2 + 22 }; }
      if (ctx.id === 'ufo') { const st = ctx.orte.stapel_oben.stapel; gw = 160; gh = 260; p = { x: st.x + st.w / 2, y: st.y + st.h / 2 - 30 }; }
      el.style.width = gw + 'px'; el.style.height = gh + 'px'; el.style.background = 'rgba(255,0,128,.35)';
      return {
        el, dauer: d, getippt: 0, abgaenge: 0, ereignisse: [], ctx,
        stelle(t) { this.t = t; w.MMF.Natur.h.setze(el, p.x - gw / 2, p.y - gh / 2, 0, 1, 1); },
        hulle() { return { x: p.x - gw / 2, y: p.y - gh / 2, w: gw, h: gh }; },
        tipp() { this.getippt++; }, scheu() { this.scheue = true; },
        abgang() { this.abgaenge++; return 0.4; },
        ereignis(ev) { this.ereignisse.push(ev.e); return ev.e === 'probe_weg'; },
      };
    },
  };
  const tick = (sek, dt) => { dt = dt || 0.5; for (let t = 0; t < sek - 1e-9; t += dt) N().tick(dt); };
  const starts = () => N().protokoll.filter(z => z.was === 'start' && z.anlass !== 'zeige');
  const info = () => JSON.stringify({ lage: N()._lage(), modal: Array.from(w.document.querySelectorAll('.modal:not([hidden])')).map(e => e.id), cur: N().zustand().current, wartet: N().trWartet, tr: N().tr, now: N().now });
  const cur = () => N().current;
  // frischer Planer am echten Tisch, Zufallsereignis sofort fällig
  function frisch(seed) {
    N().test({ neu: true, probe: PROBE, seed: seed || 3, lage: null, manuell: true });
    N().tick(0.5);
    N().test({ faellig: 0 });
  }
  const zuClient = p => { const t = App().tisch, r = t.root.getBoundingClientRect(); return { x: r.left + t.ox + p.x * t.s, y: r.top + t.oy + p.y * t.s }; };
  const mitte = r => ({ x: r.x + r.w / 2, y: r.y + r.h / 2 });
  const buehneRect = e => { const r = e.getBoundingClientRect(), t = App().tisch, a = t.zuBuehne(r.left, r.top), b = t.zuBuehne(r.right, r.bottom); return { x: a.x, y: a.y, w: b.x - a.x, h: b.y - a.y }; };
  function druck(p, ziel, mitHoch) {
    const c = zuClient(p);
    const z = ziel || w.document.elementFromPoint(c.x, c.y);
    const o = { bubbles: true, cancelable: true, clientX: c.x, clientY: c.y, pointerId: 7, pointerType: 'touch', isPrimary: true };
    const frei = z.dispatchEvent(new w.PointerEvent('pointerdown', o));
    if (mitHoch) z.dispatchEvent(new w.PointerEvent('pointerup', o));
    else w.dispatchEvent(new w.PointerEvent('pointerup', o));
    return { z, frei };
  }

  // Generischer Prüfer einer Art (8.2): Hülle über die Zeit, deckt, Aufräumen, Bestimmtheit, schneller Abgang
  function pruefeArt(id, name) {
    const n = N(), e = n.EINTRAG[id], t = App().tisch, W = t.W, H = t.H;
    const was = name + ' ' + id + ' (' + Math.round(W) + '×' + Math.round(H) + ')';
    if (!n.zeige(id, { seed: 7, t: 0, stehen: true })) { ok(false, was + ': startet'); return; }
    const dauer = n._dauer(n.current), schutz = n.schutz();
    const proben = [];
    for (let s = 0; s <= dauer + 1e-9; s += 0.05) proben.push([s, n.huelle(s)]);
    const huelleA = JSON.stringify(proben.map(p => p[1]));
    // Sichtbarkeit (hinten/mitte): in der Hauptphase (15–85 %) zu ≥ 60 % der Zeit mit der Mitte im Bild und höchstens 60 % überdeckt
    const haupt = proben.filter(p => p[0] >= dauer * 0.15 && p[0] <= dauer * 0.85);
    const sichtbar = h => {
      if (!h || h.w <= 0 || h.h <= 0) return false;
      const m = mitte(h);
      if (m.x < 0 || m.x > W || m.y < 0 || m.y > H) return false;
      const a = h.w * h.h, ueber = Math.min(a, schutz.reduce((s, q) => s + flaeche(h, q), 0));
      return ueber / a <= 0.6;
    };
    if (e.ebene !== 'vorn') {
      const anteil = haupt.filter(p => sichtbar(p[1])).length / Math.max(1, haupt.length);
      ok(anteil >= 0.6, was + ': in der Hauptphase zu ' + Math.round(anteil * 100) + ' % sichtbar (≥ 60 %)');
    } else {
      // vorn (z-index 33): nur die Flächen aus deckt, je höchstens deckt_max_s. Gezählt wird, was wirklich darunter liegt (Hand,
      // Stapel, Ablage mit Ring, Glücksspiel); Plätze, Leiste, Knöpfe und „Erwischt!“ liegen ohnehin darüber.
      const UNTER_VORN = ['hand', 'stapel', 'ablage', 'automat', 'einsatz'];
      const zeit = {};
      proben.forEach(([s, h]) => { if (!h) return; const ge = {}; schutz.forEach(q => { if (UNTER_VORN.indexOf(q.name) >= 0 && flaeche(h, q) > 0) ge[q.name] = 1; }); Object.keys(ge).forEach(k => { zeit[k] = (zeit[k] || 0) + 0.05; }); });
      Object.keys(zeit).forEach(k => {
        if (e.deckt.indexOf(k) >= 0) ok(zeit[k] <= e.deckt_max_s + 0.06, was + ': deckt ' + k + ' höchstens ' + e.deckt_max_s + ' s (' + zeit[k].toFixed(2) + ')');
        else ok(false, was + ': deckt ' + k + ' nicht (' + zeit[k].toFixed(2) + ' s)');
      });
      if (e.deckt.indexOf('hand') >= 0) {   // Eckindex (AGENTS 8): nie im linken oberen Viertel einer Handkarte
        const ecken = t.hand.reihe.map(k => t.hand.position(k.id)).filter(Boolean).map(p => { const kh = p.w * 870 / 560; return { x: p.x - p.w / 2, y: p.y - kh / 2, w: p.w / 2, h: kh / 2 }; });
        ok(!proben.some(([s, h]) => h && ecken.some(q => flaeche(h, q) > 0)), was + ': nie über dem Eckindex einer Handkarte');
      }
    }
    // Bestimmtheit: gleicher Samen → gleiche Hüllen
    n.zeige(id, { seed: 7, t: 0, stehen: true });
    const huelleB = JSON.stringify(proben.map(p => n.huelle(p[0])));
    ok(huelleA === huelleB, was + ': gleicher Samen, gleiche Bahn');
    // Aufräumen: live laufen lassen bis dauer + 1 s
    n.zeige(id, { seed: 7 });
    tick(dauer + 1, 0.05);
    ok(!n.current, was + ': nach dauer + 1 s vorbei');
    ok(!w.document.querySelector('.natur-ebene *'), was + ': keine Knoten übrig (' + (w.document.querySelector('.natur-ebene *') || {}).className + ')');
    // schneller Abgang ≤ 0,5 s
    n.zeige(id, { seed: 7 });
    tick(Math.min(1, dauer / 3), 0.05);
    n._abgang(n.current, 'test');
    tick(0.5, 0.05);
    ok(!n.current, was + ': schneller Abgang in ≤ 0,5 s');
    if (n.current) n._weg(n.current, 'test');
  }
  const flaeche = (a, b) => Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x)) * Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));

  /* ---------- Dauerlauf (Lage eingespritzt) ---------- */
  function dauerlauf() {
    const n = N(), D = n.DATEN, Z = n.ZEITEN;
    const L = { tisch: true, gross: false, eng: false, reduziert: false, phase: 'turn', meinZug: false, regieLeer: true, wechsel: false, dialog: false, fang: false, necken: 0, strafe: false, seite: 'tag', handSig: '', gewaehlt: false };
    n.test({ neu: true, seed: 42, probe: PROBE, manuell: true, lage: L });
    const zz = (() => { let a = 12345; return () => { a = (a * 1103515245 + 12345) >>> 0; return a / 4294967296; }; })();
    let naechsteSicht = 0, unruheBis = 0, wechselBis = 0, naechsterFlip = 60 + zz() * 300, naechsteRunde = 300, naechstePartie = 1200, troedelBis = -1, seat = 1;
    let top = 1000, runde = 1, flipSeiteSetzen = -1, flipSeite = 'tag';
    const marken = [];   // [{now, was, …}] Rundenwechsel, skip_all
    n.sicht([{ e: 'round_start', round: 1 }], { seat: 0, turn: 1, top: { id: top }, draw_count: 40, phase: 'turn', side: 'hell' });
    marken.push({ now: 0, was: 'partie' });
    const DT = 1, ENDE = 10 * 3600;
    for (let t = 0; t < ENDE; t += DT) {
      const now = n.now;
      L.regieLeer = now >= unruheBis;
      L.wechsel = now < wechselBis;
      if (flipSeiteSetzen >= 0 && now >= flipSeiteSetzen) { L.seite = flipSeite; flipSeiteSetzen = -1; wechselBis = now + 1.1; }
      if (now >= naechstePartie) {
        runde = 1; naechstePartie = now + 1200; naechsteRunde = now + 300;
        n.sicht([{ e: 'round_start', round: 1 }], { seat: 0, turn: seat, top: { id: ++top }, draw_count: 40, phase: 'turn', side: 'hell' });
        marken.push({ now, was: 'partie' }); unruheBis = now + 2;
      } else if (now >= naechsteRunde) {
        runde++; naechsteRunde = now + 300;
        n.sicht([{ e: 'round_start', round: runde }], { seat: 0, turn: seat, top: { id: ++top }, draw_count: 40, phase: 'turn', side: 'hell' });
        marken.push({ now, was: 'runde' }); unruheBis = now + 2;
      }
      if (now >= naechsterFlip && flipSeiteSetzen < 0) {
        naechsterFlip = now + 90 + zz() * 300;
        flipSeite = L.seite === 'tag' ? 'nacht' : 'tag';
        n.sicht([{ e: 'flip', side: flipSeite === 'nacht' ? 'dunkel' : 'hell' }], { seat: 0, turn: seat, top: { id: ++top }, draw_count: 40, phase: 'turn' });
        flipSeiteSetzen = now + 0.5; unruheBis = now + 1.6;
      }
      if (now >= naechsteSicht && now >= troedelBis) {
        // neue Sicht alle 4–12 s, Regie 20 % der Zeit kurz beschäftigt, ich bin in 25 % der Züge dran, 3 % der Züge trödeln (45 s)
        naechsteSicht = now + 4 + zz() * 8;
        seat = (seat + 1) % 4;
        L.meinZug = seat === 0;
        const ev = [];
        if (zz() < 0.02) { ev.push({ e: 'skip_all', seat }); marken.push({ now, was: 'skip_all' }); }
        n.sicht(ev, { seat: 0, turn: seat, top: { id: ++top }, draw_count: 40, phase: 'turn' });
        if (zz() < 0.2) unruheBis = now + 1 + zz() * 2;
        if (zz() < 0.03) troedelBis = now + 45;
      }
      n.tick(DT);
    }
    const P = n.protokoll;
    // nie zwei gleichzeitig: start und ende wechseln sich ab
    let offen = null, zwei = 0;
    P.forEach(z => { if (z.was === 'start') { if (offen) zwei++; offen = z; } else { offen = null; } });
    ok(zwei === 0, 'Dauerlauf: nie zwei Ereignisse gleichzeitig (' + zwei + ')');
    const st = P.filter(z => z.was === 'start');
    ok(st.length > 150, 'Dauerlauf: genug Ereignisse (' + st.length + ')');
    // Abstände ab Ende
    let letztEnde = null, letztGrund = '', gaps = [], zuKurz = 0, anlassKurz = 0;
    P.forEach(z => {
      if (z.was === 'ende') { letztEnde = z.now; letztGrund = z.grund; return; }
      if (letztEnde === null) return;
      const g = z.now - letztEnde;
      if (z.anlass === 'zufall') { gaps.push(g); if (g < Z.abstand_s[0] - 1e-6) zuKurz++; }
      else if (g < Z.anlass_abstand_s - 1e-6 && !(z.anlass === 'troedeln' && letztGrund === 'schnecke')) anlassKurz++;
    });
    const mittel = gaps.reduce((a, b) => a + b, 0) / Math.max(1, gaps.length);
    notizen.push('Dauerlauf 10 h: ' + st.length + ' Ereignisse, Abstand Ø ' + mittel.toFixed(1) + ' s, Flip ' + st.filter(z => z.anlass === 'flip').length + ', Schnecke ' + st.filter(z => z.id === 'schnecke').length);
    ok(mittel >= 150 && mittel <= 230, 'Dauerlauf: mittlerer Abstand ' + mittel.toFixed(1) + ' s (150–230)');
    ok(zuKurz === 0, 'Dauerlauf: Zufallsstart frühestens ' + Z.abstand_s[0] + ' s nach dem Ende (' + zuKurz + ' zu früh)');
    ok(anlassKurz === 0, 'Dauerlauf: Anlass frühestens ' + Z.anlass_abstand_s + ' s nach dem Ende (' + anlassKurz + ' zu früh)');
    // Wiederholungssperre: die letzten 4 beendeten derselben Seite
    const beendet = { tag: [], nacht: [] };
    let wdh = 0;
    P.forEach(z => {
      const e = n.EINTRAG[z.id];
      if (z.was === 'ende') { beendet[e.seite].push(z.id); return; }
      if (z.anlass === 'zufall' && beendet[e.seite].slice(-Z.keine_wiederholung).indexOf(z.id) >= 0) wdh++;
    });
    ok(wdh === 0, 'Dauerlauf: keine Wiederholung unter den letzten ' + Z.keine_wiederholung + ' (' + wdh + ')');
    // Seite und fremder Zug
    ok(st.every(z => n.EINTRAG[z.id].seite === z.tischSeite), 'Dauerlauf: Tagtiere nur am Tag, Nachttiere nur nachts');
    ok(st.every(z => !(n.EINTRAG[z.id].fremder_zug && z.meinZug)), 'Dauerlauf: fremder_zug nie im eigenen Zug');
    // je_partie / je_runde und Flip-Anlass je Runde und Seite
    let verstoss = 0, flipVerstoss = 0, kometVerstoss = 0;
    const alle = marken.concat(st.map(z => Object.assign({ was: 'start' }, z))).sort((a, b) => a.now - b.now || (a.was === 'start' ? 1 : -1));
    let zp = {}, zr = {}, fr = {}, skipAll = -1e9;
    alle.forEach(z => {
      if (z.was === 'partie') { zp = {}; zr = {}; fr = {}; return; }
      if (z.was === 'runde') { zr = {}; fr = {}; return; }
      if (z.was === 'skip_all') { skipAll = z.now; return; }
      const e = n.EINTRAG[z.id];
      zp[z.id] = (zp[z.id] || 0) + 1; zr[z.id] = (zr[z.id] || 0) + 1;
      if ((e.je_partie && zp[z.id] > e.je_partie) || (e.je_runde && zr[z.id] > e.je_runde)) verstoss++;
      if (z.anlass === 'flip') { fr[e.seite] = (fr[e.seite] || 0) + 1; if (fr[e.seite] > Z.flip_je_runde) flipVerstoss++; }
      if (z.id === 'komet' && z.now < skipAll + Z.komet_sperre_s) kometVerstoss++;
    });
    ok(verstoss === 0, 'Dauerlauf: je_partie/je_runde eingehalten (' + verstoss + ')');
    ok(flipVerstoss === 0, 'Dauerlauf: höchstens ein Flip-Ereignis je Runde und Seite (' + flipVerstoss + ')');
    ok(kometVerstoss === 0, 'Dauerlauf: kein Komet in den ' + Z.komet_sperre_s + ' s nach skip_all (' + kometVerstoss + ')');
    const flips = st.filter(z => z.anlass === 'flip');
    ok(flips.length >= 5 && flips.every(z => n.EINTRAG[z.id].nach_flip > 0), 'Dauerlauf: Flip-Anlässe kommen vor, nur aus nach_flip (' + flips.length + ')');

      ok(spione.antippen.indexOf(hk.id) >= 0, 'Handkarte unter der Biene angetippt (' + JSON.stringify(spione.antippen) + ')');
      ok(!!cur() && cur().ende !== null, 'Biene geht bei Berührung der Hand');
      tick(0.5, 0.1);
      // Kopf eines Mitspielers: Necken-Menü, kein Tier reagiert
      n.zeige('spatz', { seed: 1 }); n.tick(0.1);
      const kopf = $('#tisch .gg[data-seat="1"] .kopf');
      const km = mitte(buehneRect(kopf));
      druck(km, kopf);
      kopf.click();
      ok(!!w.MMF.Necken.offen && w.MMF.Necken.offen.seat === 1, 'Tipp auf den Kopf: Necken-Menü offen');
      ok(cur().inst.getippt === 0, 'Tipp auf den Kopf: Spatz reagiert nicht');
      w.MMF.Necken.zu();
      // freie Stelle auf dem Spatz: Reaktion, keine App-Aktion
      const h = n.huelle();
      const p = mitte(h);
      const c3 = zuClient(p), z3 = w.document.elementFromPoint(c3.x, c3.y);
      ok(!!z3 && (z3.classList.contains('buehne') || !!z3.closest('.himmel')), 'Spatz sitzt auf einer freien Stelle (' + (z3 && (z3.id || z3.className)) + ')');
      const v0 = JSON.stringify(spione);
      const d3 = druck(p);
      ok(cur().inst.getippt === 1 && cur().getippt, 'Tipp auf den freien Spatz: Reaktion');
      ok(JSON.stringify(spione) === v0 && !w.MMF.Necken.offen, 'Tipp auf den freien Spatz: keine App-Aktion');
      ok(d3.frei, 'pointerdown auf dem Spatz nicht verhindert');
      druck(p);
      ok(cur().inst.getippt === 1, 'höchstens eine Reaktion je Ereignis');
      n._weg(cur(), 'test');
      // Vorführung: 7 Tipps in 4 s auf eine freie Stelle
      n.test({ neu: true, probe: PROBE, seed: 31 });
      n.tick(0.5);
      const frei = { x: n.orte().himmel_frei.x + 40, y: n.orte().himmel_frei.y + 30 };
      for (let i = 0; i < 6; i++) druck({ x: frei.x + i * 3, y: frei.y });
      ok(!n.demo.an, '6 Tipps: noch keine Vorführung');
      druck(frei);
      ok(n.demo.an, '7 Tipps: Vorführung an');
      n.tick(0.5);
      const ids = n.DATEN.ereignisse.filter(e => e.seite === 'tag').map(e => e.id);
      ok(!!cur() && cur().id === ids[0] && cur().anlass === 'demo', 'Vorführung: erstes Ereignis der Seite (' + (cur() && cur().id) + ')');
      n._weg(cur(), 'test');
      tick(12.5);
      ok(!!cur() && cur().id === ids[1], 'Vorführung: nach 12 s das nächste in Tabellenreihenfolge (' + (cur() && cur().id) + ')');
      if (cur()) n._weg(cur(), 'test');
      for (let i = 0; i < 7; i++) druck(frei);
      ok(!n.demo.an, '7 Tipps: Vorführung aus');
      App().zeigeScreen('lobby'); n.demo.an = true; n.tick(0.5);
      ok(!n.demo.an, 'Tisch verlassen: Vorführung aus');
      App().zeigeScreen('tisch');
      Object.assign(App(), alt);
    }

    /* ---------- generischer Prüfer (Probe) und alle angemeldeten Arten ---------- */
    {
      const n = N();
      n.test({ neu: true, probe: PROBE, seed: 1, lage: null });
      await zustand(1);
      n.tick(0.5);
      const vor = fehler.length;
      pruefeArt('spatz', 'Probe');
      pruefeArt('wolke', 'Probe');
      ok(fehler.length === vor, 'Prüfer läuft mit der Probe ohne Befund');
      // Gegenprobe: das Proben-UFO deckt den Stapel die ganze Zeit (> 3 s) – das muss der Prüfer finden
      pruefeArt('ufo', 'Gegenprobe');
      const befunde = fehler.splice(vor);
      ok(befunde.some(b => /deckt stapel höchstens 3 s/.test(b)), 'Prüfer findet zu langes Decken (' + befunde.join(' / ').slice(0, 200) + ')');
      n.test({ probe: null });
      const arten = n.arten();
      for (const [b, hh] of [[590, 360], [844, 390], [1000, 360]]) {
        await groesse(b, hh);
        for (const seite of ['hell', 'dunkel']) {
          const liste = arten.filter(id => n.EINTRAG[id].seite === (seite === 'hell' ? 'tag' : 'nacht'));
          if (!liste.length) continue;
          topId++;
          S.rx({ t: 'state', events: [], view: sicht(1, { side: seite }) });
          await warte(1800);
          n.tick(0.5);
          liste.forEach(id => pruefeArt(id, 'Art'));
        }
      }
      await groesse(844, 390);
      notizen.push('angemeldete Arten: ' + arten.length);
      // Gegenprüfung 1.6.12: keine doppelten @keyframes-Namen (die letzte Regel gewinnt; Fledermaus-Blinken überschrieb den Flügelschlag)
      {
        const namen = {};
        Array.from(w.document.styleSheets).forEach(sh => { let rs = []; try { rs = Array.from(sh.cssRules); } catch (e) { }
          rs.forEach(r => { if (r.type === 7) namen[r.name] = (namen[r.name] || 0) + 1; }); });
        const natNamen = {}; { const st = w.document.getElementById('natur-stil'); Array.from((st && st.sheet && st.sheet.cssRules) || []).forEach(r => { if (r.type === 7) natNamen[r.name] = 1; }); }
        const doppelt = Object.keys(namen).filter(k => namen[k] > 1 && natNamen[k]);   // nur Natur-Namen (style.css nkHuepf ist doppelt, eigene Baustelle)
        ok(Object.keys(natNamen).length > 5, '#natur-stil hat Keyframes (' + Object.keys(natNamen).length + ')');
        ok(!doppelt.length, 'keine doppelten @keyframes (' + doppelt.join(', ') + ')');
      }
      // Gegenprüfung 1.6.12: Glühwürmchen-Lichter sitzen mittig auf ihrer berechneten Lage (Hülle = Lichtmitten ± 13)
      if (arten.indexOf('gluehwuermchen') >= 0) {
        topId++;
        S.rx({ t: 'state', events: [], view: sicht(1, { side: 'dunkel' }) });
        await warte(1800);
        n.tick(0.5);
        n.zeige('gluehwuermchen', { seed: 7, t: 0, stehen: true });
        const dd = n._dauer(n.current), h = n.huelle(dd * 0.5);
        const ls = Array.from(w.document.querySelectorAll('.natur-ebene .nt-gw')).filter(e => +e.style.opacity > 0.04).map(e => mitte(buehneRect(e)));
        let l = 1e9, o2 = 1e9, r = -1e9, u = -1e9;
        ls.forEach(p => { l = Math.min(l, p.x); r = Math.max(r, p.x); o2 = Math.min(o2, p.y); u = Math.max(u, p.y); });
        const pass = !!h && ls.length > 0 && Math.abs(l - 13 - h.x) < 2 && Math.abs(o2 - 13 - h.y) < 2 && Math.abs(r + 13 - (h.x + h.w)) < 2 && Math.abs(u + 13 - (h.y + h.h)) < 2;
        ok(pass, 'Glühwürmchen: Lichter mittig auf ihrer Lage (Hülle ' + JSON.stringify(h && { x: Math.round(h.x), y: Math.round(h.y) }) + ', Lichter ab ' + Math.round(l) + ',' + Math.round(o2) + ')');
        const e0 = w.document.querySelector('.natur-ebene .nt-gw');
        ok(!!e0 && w.getComputedStyle(e0).left === '-32px', 'Glühwürmchen: left −32 px greift (' + (e0 && w.getComputedStyle(e0).left) + ')');
        n._weg(n.current, 'test');
      }
      // Gegenprüfung 1.6.12: Marienkäfer- und Bienenflügel schlagen (Transform), nicht blinken
      {
        const anim = sel => { const e = w.document.createElement('i'); e.className = sel; w.document.body.appendChild(e); const nm = w.getComputedStyle(e).animationName; e.remove(); return nm; };
        const kf = nm => { let k = null; Array.from(w.document.styleSheets).forEach(sh => { try { Array.from(sh.cssRules).forEach(r => { if (r.type === 7 && r.name === nm) k = r; }); } catch (e) { } }); return k; };
        ['nt-mk-flap', 'nt-bi-flap'].forEach(c => { const k = kf(anim(c)); ok(!!k && /transform/.test(k.cssText) && !/opacity/.test(k.cssText), c + ': Flügelschlag per transform (' + String(k && k.cssText).slice(0, 80) + ')'); });
      }
    }

    /* ---------- 1.6.15: Antippen der neuen Arten (echte Arten, echter Druck auf eine freie Stelle) ---------- */
    {
      const n = N();
      n.test({ probe: null, lage: null, faellig: 1e9 });   // kein Zufallsereignis dazwischen
      const innenR = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
      // freier Punkt in der Hülle: Tipp ginge ins Leere (kein Spielelement, keine Schutzfläche) und träfe das Tier
      const freierPunkt = () => {
        const c = n.current, h = c && n._hulle(c);
        if (!h) return null;
        const sch = n.schutz();
        for (const fy of [0.5, 0.3, 0.7, 0.15, 0.85, 0.05]) for (const fx of [0.5, 0.3, 0.7, 0.15, 0.85]) {
          const p = { x: h.x + h.w * fx, y: h.y + h.h * fy }, cl = zuClient(p), z = w.document.elementFromPoint(cl.x, cl.y);
          if (z && n._leer(z) && !sch.some(r => innenR(p, r)) && n._trifft(c, h, p)) return p;
        }
        return null;
      };
      // Art mit Samen 1…30 zur Zeit t starten, bis eine freie Stelle zum Antippen da ist
      let befund = '';   // letzter Fehlversuch (für die Fehlermeldung)
      const antippbar = (id, t) => {
        for (let s = 1; s <= 30; s++) { n.zeige(id, { seed: s, t }); const p = freierPunkt(); if (p) return p; }
        const c = n.current, h = c && n._hulle(c);   // Befund für die Fehlermeldung
        if (h) { const m = { x: h.x + h.w / 2, y: h.y + h.h / 2 }, cl = zuClient(m), z = w.document.elementFromPoint(cl.x, cl.y);
          befund = (id + ': Hülle ' + JSON.stringify({ x: Math.round(h.x), y: Math.round(h.y), w: Math.round(h.w), h: Math.round(h.h) }) + ' Mitte unter ' + (z && (z.id || z.className))
            + ' leer ' + (z && n._leer(z)) + ' Schutz ' + n.schutz().filter(r => innenR(m, r)).map(r => r.name).join('/') + ' trifft ' + n._trifft(c, h, m)); }
        else befund = id + ': keine Hülle (' + (c ? c.id + ' t ' + c.t : 'nichts') + ')';
        return null;
      };
      const seite = async sd => {
        topId++; S.rx({ t: 'state', events: [], view: sicht(1, { side: sd }) }); await warte(1800); n.tick(0.5);
        // offene Fenster der vorigen Prüfungen (z. B. Kartenhilfe) schließen, sonst liegt der Tipp darauf
        w.document.querySelectorAll('.modal:not([hidden])').forEach(m => { try { App().schliesse(m.id); } catch (e) { /* egal */ } if (!m.hidden) m.hidden = true; });
      };
      await seite('dunkel');
      // UFO: 1. und 2. Tipp → weicht aus, 3. → davon
      let p = antippbar('ufo', 2.6);
      ok(!!p, 'UFO: freie Stelle zum Antippen (' + befund + ')');
      if (p) {
        const h0 = n.huelle();
        druck(p);
        ok(cur().tipps === 1 && cur().ende === null, 'UFO: 1. Tipp – bleibt');
        tick(0.3, 0.05);
        const h1 = n.huelle();
        ok(!!h0 && !!h1 && Math.abs((h1.x + h1.w / 2) - (h0.x + h0.w / 2)) > 30, 'UFO: weicht zur Seite aus');
        tick(1.9, 0.05);
        p = freierPunkt();
        ok(!!p, 'UFO: wieder antippbar');
        if (p) { druck(p); ok(cur().tipps === 2 && cur().ende === null, 'UFO: 2. Tipp – bleibt'); }
        tick(0.4, 0.05);
        p = freierPunkt();
        if (p) { druck(p); ok(!!cur() && cur().tipps === 3 && cur().inst.leaveT !== null, 'UFO: 3. Tipp – saust davon (' + JSON.stringify({ t: cur() && cur().t, tipps: cur() && cur().tipps, inst: cur() && cur().inst.tipps, leave: cur() && cur().inst.leaveT }) + ')'); }
        else ok(false, 'UFO: Stelle für den 3. Tipp');
        tick(0.5, 0.05);
        ok(!cur() || cur().id !== 'ufo', 'UFO: danach weg');
      }
      // Feuerwerk: Tipp zündet einen Knall an der Stelle, höchstens zweimal
      p = antippbar('feuerwerk', 2.2);
      ok(!!p, 'Feuerwerk: freie Stelle zum Antippen (' + befund + ')');
      if (p) {
        druck(p);
        ok(cur().tipps === 1, 'Feuerwerk: Tipp angenommen');
        tick(0.25, 0.05);
        ok(cur().inst.knalle(cur().t).some(k => Math.hypot(k.x - p.x, k.y - 12 - p.y + 12) < 30), 'Feuerwerk: Knall an der Tippstelle');
        const p2 = freierPunkt();
        if (p2) druck(p2);
        tick(0.2, 0.05);
        const p3 = freierPunkt();
        if (p3) druck(p3);
        ok(cur().tipps === 2 && cur().inst.tipps.length === 2, 'Feuerwerk: höchstens zwei Knalle per Tipp (' + cur().tipps + ')');
        n._weg(cur(), 'test');
      }
      // Astronaut: Salto
      p = antippbar('astronaut', 5);
      ok(!!p, 'Astronaut: freie Stelle zum Antippen (' + befund + ')');
      if (p) {
        const tr0 = cur().el.style.transform;
        druck(p);
        ok(cur().inst.tapT !== null, 'Astronaut: Tipp angenommen');
        tick(0.95, 0.05);
        const tr1 = cur().el.style.transform;
        const rot = s => { const m = /rotate\((-?[\d.]+)deg\)/.exec(s || ''); return m ? +m[1] : 0; };
        ok(Math.abs(rot(tr1) - rot(tr0)) > 120, 'Astronaut: Salto (' + rot(tr0) + '° → ' + rot(tr1) + '°)');
        tick(1.2, 0.05);
        ok(!!cur() && cur().ende === null, 'Astronaut: schwebt danach weiter');
        n._weg(cur(), 'test');
      }
      await seite('hell');
      // Hoppelhase: Schreck-Sprung
      p = null;
      for (const t of [2.5, 3.5, 4.5, 6, 7.5]) { p = antippbar('hoppelhase', t); if (p) break; }
      ok(!!p, 'Hoppelhase: freie Stelle zum Antippen (' + befund + ')');
      if (p) {
        const h0 = n.huelle();
        druck(p);
        ok(!!cur().inst.tap, 'Hoppelhase: Tipp angenommen');
        tick(0.27, 0.03);
        const h1 = n.huelle();
        ok(!!h1 && h1.y < h0.y - 40, 'Hoppelhase: springt erschrocken hoch');
        tick(1.4, 0.05);
        ok(!cur(), 'Hoppelhase: danach schnell davon');
      }
      // Strand: Palme schüttelt sich, eine Kokosnuss fällt; der Mau-Knopf bleibt darüber und antippbar
      p = antippbar('strand', 4.2);
      ok(!!p, 'Strand: Palme antippbar (' + befund + ')');
      if (p) {
        const mau = buehneRect($('#mau')), mc = zuClient(mitte(mau)), oben = w.document.elementFromPoint(mc.x, mc.y);
        ok(!!oben && !!oben.closest('#mau'), 'Strand: Mau-Knopf liegt darüber (' + (oben && (oben.id || oben.className)) + ')');
        druck(p);
        ok(cur().inst.tapT !== null, 'Strand: Tipp auf die Palme angenommen');
        tick(0.3, 0.05);
        const nuss = cur().el.querySelector('.nt-st-fa');
        ok(+nuss.style.opacity > 0.5, 'Strand: Kokosnuss fällt');
        n._weg(cur(), 'test');
        n.zeige('strand', { seed: 3, t: 1.3 });
        const h = n.huelle(), sp = { x: h.x + h.w * 0.3, y: h.y + h.h * 0.4 };
        ok(!n._trifft(cur(), h, sp), 'Strand: Sand ohne Palme nimmt keinen Tipp');
        n._weg(cur(), 'test');
      }
    }

    /* ---------- nichts nach außen ---------- */
    ok(natTon === 0, 'kein Ton aus natur*.js (' + natTon + ')');
    ok(natVib === 0, 'keine Vibration aus natur*.js (' + natVib + ')');
    ok(natSenden === 0, 'nichts an den WebSocket aus natur*.js (' + natSenden + ')');
    ok(natPrevent === 0, 'kein preventDefault aus natur*.js (' + natPrevent + ')');
    ok(!App().fehler || !App().fehler.length, 'keine Fehler in der App (' + JSON.stringify(App().fehler || []).slice(0, 300) + ')');

    /* ---------- ?natur=reihe ---------- */
    await lade('?natur=reihe');
    ok(!!N() && N().demo.an === true && N().manuell === false, '?natur=reihe: Vorführung an, echte Uhr');
  }
  lauf().then(() => {}, e => fehler.push('Ausnahme: ' + (e && e.stack || e))).then(() => {
    const el = document.getElementById('autotest-result');
    el.setAttribute('data-ok', fehler.length ? '0' : '1');
    el.textContent = (fehler.length ? 'FEHLER: ' + fehler.join(' | ') : 'ok') + (notizen.length ? ' (' + notizen.join('; ') + ')' : '');
  });
})();
</script></body></html>
