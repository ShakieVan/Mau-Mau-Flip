<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Test Online-Verbindung</title></head>
<body>
<pre id="autotest-result">läuft …</pre>
<script src="../netz.js"></script>
<script>
/* Test des Online-Modus von netz.js gegen einen Schein-WebSocket (Vermittler-Verhalten: Ping/Pong-Text, Schließcodes 4503/4404/4409/1001).
 * Aufruf: chrome --headless=new --virtual-time-budget=120000 --dump-dom file:///…/webclient/test/netz_online.html
 * Ergebnis: <pre id="autotest-result" data-ok="1|0">. Läuft nicht im Spiel, wird nur mit web.zip ausgeliefert. */
(function () {
  const M = window.MMF, O = M.Netz.Online;
  const fehler = [];
  const ok = (b, t) => { if (!b) fehler.push(t); };
  const warte = ms => new Promise(r => setTimeout(r, ms));

  // ---- reine Funktionen ----
  const codes = [['katze-42', 'KATZE-42'], ['KATZE42', 'KATZE-42'], [' Katze 42 ', 'KATZE-42'], ['katze_42', 'KATZE-42'], ['mäuse-10', 'MAEUSE-10'],
    ['Füchse99', 'FUECHSE-99'], ['STRASSE-11', 'STRASSE-11'], ['', ''], ['KATZE', ''], ['KATZE-4', ''], ['42', ''], ['KATZE-421', ''], ['KA TZE-42', ''], ['KATZE-4a', '']];
  codes.forEach(([i, o]) => ok(O.code(i) === o, 'code(' + JSON.stringify(i) + ') = ' + O.code(i) + ', erwartet ' + o));
  ok(O.code(null) === '' && O.code(undefined) === '', 'code(null)');
  ok(O.wsUrl({ protocol: 'https:', host: 'mmf.example.workers.dev' }, 'KATZE-42') === 'wss://mmf.example.workers.dev/ws?role=guest&room=KATZE-42', 'wsUrl https');
  ok(O.wsUrl({ protocol: 'http:', host: 'localhost:24700' }, 'KATZE-42') === 'ws://localhost:24700/ws?role=guest&room=KATZE-42', 'wsUrl http');
  ok(O.infoUrl('KATZE-42') === '/info?room=KATZE-42', 'infoUrl');
  const loc = { protocol: 'https:', host: 'mmf.example.workers.dev', pathname: '/c/1.2.2/' };
  const intent = O.appIntent(loc, 'KATZE-42');
  ok(intent.indexOf('intent://join?r=KATZE-42&v=mmf.example.workers.dev#Intent;scheme=maumauflip;package=de.maumauflip.game;S.browser_fallback_url=') === 0, 'appIntent Kopf: ' + intent);
  ok(decodeURIComponent(intent.split('S.browser_fallback_url=')[1].replace(';end', '')) === 'https://mmf.example.workers.dev/c/1.2.2/?r=KATZE-42&app=1', 'appIntent Rückfall');
  ok(/^https:\/\/github\.com\/ShakieVan\/Mau-Mau-Flip\/releases/.test(O.GITHUB_RELEASES), 'GitHub-Releases');

  // ---- Schein-WebSocket ----
  const sockets = [];
  class FakeWS {
    constructor(url) { this.url = url; this.readyState = 0; this.gesendet = []; sockets.push(this); setTimeout(() => this._auf(), 5); }
    _auf() { if (this.readyState !== 0) return; this.readyState = 1; if (this.onopen) this.onopen(); }
    send(s) { this.gesendet.push(s); }
    close() { this.readyState = 3; }
    // Gegenstelle: Nachricht bzw. Schließen mit Code
    rx(s) { if (this.onmessage) this.onmessage({ data: s }); }
    schliesse(code) { this.readyState = 3; if (this.onclose) this.onclose({ code }); }
  }
  window.WebSocket = FakeWS;

  function neu(online, extra) {
    sockets.length = 0;
    const stat = [], nachr = [];
    const v = new M.Netz.Verbindung(Object.assign({ url: 'wss://x/ws?role=guest&room=KATZE-42', online, zeiten: { ping: 1500, still: 3500, hostWeg: 2500 },
      hallo: () => ({ t: 'hello', proto: 1, name: 'Kim' }), beiNachricht: m => nachr.push(m), beiStatus: s => stat.push(s) }, extra || {}));
    return { v, stat, nachr };
  }

  async function lauf() {
    // 1. online: hello als JSON, Herzschlag als Text „ping“, „pong“ hält am Leben
    let t = neu(true);
    t.v.start();
    await warte(50);
    ok(sockets.length === 1 && sockets[0].gesendet.length === 1 && JSON.parse(sockets[0].gesendet[0]).t === 'hello', 'online: hello zuerst');
    ok(t.stat.join() === 'verbinde,offen', 'online: Status ' + t.stat.join());
    for (let i = 0; i < 6; i++) { await warte(1000); sockets[0].rx('pong'); }   // 6 s, jede Sekunde ein „pong“
    ok(sockets.length === 1, 'online: mit pong keine Neuverbindung');
    const pings = sockets[0].gesendet.slice(1);
    ok(pings.length >= 2 && pings.every(p => p === 'ping'), 'online: Herzschlag ist der Text ping (' + JSON.stringify(pings) + ')');
    sockets[0].rx('{"t":"welcome","id":3}');
    ok(t.nachr.length === 1 && t.nachr[0].t === 'welcome', 'online: Spielnachricht kommt an, pong nicht');
    // Stille → neu verbinden
    await warte(5000);
    ok(sockets.length === 2 && t.stat.indexOf('getrennt') >= 0, 'online: Stille führt zu Neuverbindung (' + sockets.length + ')');
    t.v.beenden();

    // 2. 4503: warten, nicht sofort neu
    t = neu(true);
    t.v.start(); await warte(50);
    sockets[0].schliesse(4503);
    ok(t.stat[t.stat.length - 1] === 'host_weg', 'online: 4503 → host_weg');
    await warte(1500);
    ok(sockets.length === 1, 'online: 4503 wartet (nach 1,5 s noch kein neuer Versuch)');
    await warte(1500);
    ok(sockets.length === 2, 'online: 4503 → nach hostWeg neuer Versuch');
    t.v.beenden();

    // 3. endgültige Codes
    for (const [code, status] of [[4404, 'kein_raum'], [4409, 'voll'], [1001, 'raum_ende'], [4000, 'ersetzt']]) {
      t = neu(true);
      t.v.start(); await warte(50);
      sockets[0].schliesse(code);
      await warte(6000);
      ok(sockets.length === 1 && t.stat[t.stat.length - 1] === status, 'online: ' + code + ' → ' + status + ' endgültig (' + t.stat.join() + ', ' + sockets.length + ' Sockets)');
      t.v.beenden();
    }
    // sonstige Codes: normal neu verbinden
    t = neu(true);
    t.v.start(); await warte(50);
    sockets[0].schliesse(1006);
    await warte(1500);
    ok(sockets.length === 2 && t.stat[t.stat.length - 2] === 'getrennt', 'online: 1006 → nach 1 s neu');
    t.v.beenden();

    // 4. Weckruf online: Text ping
    t = neu(true);
    t.v.start(); await warte(50);
    const vorher = sockets[0].gesendet.length;
    t.v.wecken();
    ok(sockets[0].gesendet.length === vorher + 1 && sockets[0].gesendet[vorher] === 'ping', 'online: wecken sendet Text ping');
    t.v.beenden();

    // 5. LAN unverändert: Spiel-ping als JSON, Code 4404 nicht besonders
    t = neu(false, { zeiten: { ping: 1500 } });
    t.v.start(); await warte(50);
    await warte(2200);
    const lan = sockets[0].gesendet.slice(1);
    ok(lan.length >= 1 && JSON.parse(lan[0]).t === 'ping', 'LAN: Herzschlag bleibt {t:ping}');
    sockets[0].schliesse(4404);
    await warte(1500);
    ok(sockets.length === 2 && t.stat.indexOf('kein_raum') < 0, 'LAN: 4404 ist nicht endgültig');
    t.v.beenden();

    // 6. App-Wechsel (Beta 1.3.3): verdeckt → {t:away}; sichtbar → {t:back} + ping; still tot → binnen 3 s neuer Socket, dort wieder away,
    //    falls noch verdeckt
    t = neu(true);
    t.v.start(); await warte(50);
    let n0 = sockets[0].gesendet.length;
    t.v.weg();
    ok(JSON.parse(sockets[0].gesendet[n0]).t === 'away', 'App-Wechsel: weg() sendet away');
    n0 = sockets[0].gesendet.length;
    t.v.zurueck();
    ok(JSON.parse(sockets[0].gesendet[n0]).t === 'back' && sockets[0].gesendet[n0 + 1] === 'ping', 'App-Wechsel: zurueck() sendet back, dann ping');
    await warte(3300);
    ok(sockets.length === 2, 'App-Wechsel: ohne Antwort nach 3 s sofort neu verbunden (' + sockets.length + ' Sockets)');
    await warte(50);
    t.v.weg();
    sockets[1].schliesse(1006);
    await warte(1500);
    const s3 = sockets[sockets.length - 1];
    ok(sockets.length === 3 && s3.gesendet.length >= 2 && JSON.parse(s3.gesendet[0]).t === 'hello' && JSON.parse(s3.gesendet[1]).t === 'away',
      'App-Wechsel: neu angemeldet im Hintergrund → hello, dann away');
    t.v.beenden();

    // 7. Mau-Mau Flip (Beta 1.6.2, Gastgeber-Wechsel im WLAN, docs/module/uebergabe.md 10.9): Umzug (reine Funktionen), umziehen(), Reihum
    const U = M.Netz.Umzug;
    ok(U.basis('http://192.168.1.5:24690/') === 'http://192.168.1.5:24690/' && U.basis('http://10.0.0.2:24691') === 'http://10.0.0.2:24691/', 'Umzug.basis');
    ['https://192.168.1.5:24690/', 'http://beispiel.de:80/', 'http://192.168.1.256:1/', 'http://1.2.3.4:0/', 'http://1.2.3.4:70000/', 'http://1.2.3.4:5/x', '', null, 'javascript:1']
      .forEach(x => ok(U.basis(x) === '', 'Umzug.basis lehnt ab: ' + x));
    ok(U.vonAdresse('192.168.43.7', 24690) === 'http://192.168.43.7:24690/', 'Umzug.vonAdresse');
    ok(U.wsUrl('http://192.168.1.5:24690/') === 'ws://192.168.1.5:24690/ws' && U.infoUrl('http://192.168.1.5:24690/') === 'http://192.168.1.5:24690/info', 'Umzug.wsUrl/infoUrl');
    let hs = U.hosts({ t: 'hosts', gid: 'ab12', gen: 3, list: [{ name: '  Anna  ', url: 'http://192.168.1.7:24690/' }, { name: 'X', url: 'https://evil/' }, { name: 'Anna2', url: 'http://192.168.1.7:24690' }, { name: 'Ben', url: 'http://192.168.1.8:24690/' }],
      online: 'https://relay.example.dev/c/1.6.2/?r=KATZE-42', ap: true, ap_name: 'Anna' });
    ok(hs && hs.gid === 'ab12' && hs.gen === 3 && hs.list.length === 2 && hs.list[0].name === 'Anna' && hs.list[1].url === 'http://192.168.1.8:24690/'
      && hs.online === 'https://relay.example.dev/c/1.6.2/?r=KATZE-42' && hs.ap === true && hs.ap_name === 'Anna', 'Umzug.hosts: ' + JSON.stringify(hs));
    ok(U.hosts({ gid: 'zz', gen: 1, list: [] }) === null && U.hosts({ gid: 'ab', gen: -1 }) === null && U.hosts({ gid: 'ab', gen: 1.5 }) === null && U.hosts(null) === null, 'Umzug.hosts lehnt kaputte gid/gen ab');
    hs = U.hosts({ gid: 'ab', gen: 0, online: 'javascript:alert(1)', ap: 'ja' });
    ok(hs && hs.list.length === 0 && hs.online === '' && hs.ap === false, 'Umzug.hosts: leere Liste, kein Link, ap nur bei true');
    let mv = U.move({ t: 'move', gid: 'ab', gen: 4, how: 'lan', addr: '192.168.1.7', port: 24690 });
    ok(mv && mv.how === 'lan' && mv.basis === 'http://192.168.1.7:24690/', 'Umzug.move lan aus addr/port');
    mv = U.move({ how: 'lan', url: 'http://192.168.1.9:24695/', addr: 'x', port: 1 });
    ok(mv && mv.basis === 'http://192.168.1.9:24695/', 'Umzug.move lan aus url');
    ok(U.move({ how: 'lan', addr: 'host', port: 1 }) === null && U.move({ how: 'online', url: '' }) === null && U.move({ how: 'quer' }) === null, 'Umzug.move lehnt ab');
    mv = U.move({ how: 'online', url: 'https://relay.example.dev/c/1.6.2/?r=KATZE-42', room: 'KATZE-42' });
    ok(mv && mv.url === 'https://relay.example.dev/c/1.6.2/?r=KATZE-42', 'Umzug.move online');
    mv = U.move({ how: 'qr', name: 'Anna', gid: 'ab' });
    ok(mv && mv.how === 'qr' && mv.name === 'Anna' && mv.gid === 'ab', 'Umzug.move qr');
    ok(U.ziel('http://192.168.1.7:24690/', 'a1b2', 'Kim Lee') === 'http://192.168.1.7:24690/#t=a1b2&n=Kim%20Lee', 'Umzug.ziel: ' + U.ziel('http://192.168.1.7:24690/', 'a1b2', 'Kim Lee'));
    ok(U.ziel('https://r.dev/c/1/?r=KATZE-42#alt', 'a1', '') === 'https://r.dev/c/1/?r=KATZE-42#t=a1' && U.ziel('http://1.2.3.4:5/', null, '') === 'http://1.2.3.4:5/', 'Umzug.ziel ohne Name/Token');
    let a = U.leseHash('#t=a1b2&n=Kim%20Lee');
    ok(a && a.t === 'a1b2' && a.n === 'Kim Lee', 'Umzug.leseHash');
    a = U.leseHash('#t=<script>&n=' + encodeURIComponent('Ein sehr sehr langer Name'));
    ok(a && a.t === '' && a.n === 'Ein sehr sehr ', 'Umzug.leseHash: Token geprüft, Name gekürzt (' + JSON.stringify(a) + ')');
    ok(U.leseHash('') === null && U.leseHash('#abschnitt') === null && U.leseHash('#t=%E0%A4%A') === null, 'Umzug.leseHash: nichts → null');

    // umziehen(): neue URL, sofort verbinden (versuche = 0), hello mit Token wie bisher
    t = neu(false, { url: 'ws://192.168.1.5:24690/ws' });
    t.v.start(); await warte(50);
    sockets[0].schliesse(1006);
    await warte(50);
    ok(t.v.umziehen('ws://192.168.1.7:24690/ws') === true, 'umziehen() nimmt an');
    await warte(50);
    const su = sockets[sockets.length - 1];
    ok(su.url === 'ws://192.168.1.7:24690/ws' && t.v.status === 'offen' && JSON.parse(su.gesendet[0]).t === 'hello' && t.v.versuche === 0, 'umziehen(): neuer Socket an die neue Adresse');
    su.schliesse(1006);
    await warte(1200);
    ok(sockets[sockets.length - 1].url === 'ws://192.168.1.7:24690/ws', 'umziehen(): Neuversuche gehen an die neue Adresse');
    t.v.beenden();
    ok(t.v.umziehen('ws://192.168.1.8:24690/ws') === false, 'umziehen() nach beenden() nicht mehr');

    // Reihum: Treffer nur bei gleicher gid und höherer gen; erster Treffer in Rangfolge; Abbruch nach frist; wiederholt alle abstand ms
    const antworten = {};      // url → {gid, gen} | 'haengt' | 'fehler'
    const abgefragt = [];
    const fakeFetch = (url, o) => {
      abgefragt.push(url);
      ok(o && o.cache === 'no-store', 'Reihum: fetch mit cache no-store');
      const x = antworten[url];
      if (x === 'haengt') return new Promise((r, f) => { if (o && o.signal) o.signal.addEventListener('abort', () => f(new Error('abort'))); });
      if (!x || x === 'fehler') return Promise.reject(new Error('weg'));
      return Promise.resolve({ ok: true, json: () => Promise.resolve(x) });
    };
    const treffer = [];
    const rh = new M.Netz.Reihum({ fetch: fakeFetch, abstand: 500, frist: 200, beiTreffer: (b, info) => treffer.push([b, info.gen]) });
    rh.setze(U.hosts({ gid: 'ab', gen: 2, list: [{ name: 'Anna', url: 'http://10.0.0.1:24690/' }, { name: 'Ben', url: 'http://10.0.0.2:24690/' }, { name: 'Cem', url: 'http://10.0.0.3:24690/' }] }));
    antworten['http://10.0.0.1:24690/info'] = 'haengt';
    antworten['http://10.0.0.2:24690/info'] = { gid: 'ab', gen: 2 };     // gleiche gen: kein Treffer
    antworten['http://10.0.0.3:24690/info'] = { gid: 'cd', gen: 9 };     // fremde Partie: kein Treffer
    rh.start();
    await warte(1300);
    ok(treffer.length === 0 && rh.runden >= 2 && abgefragt.length >= 6, 'Reihum: ohne Treffer weiter (' + rh.runden + ' Runden, ' + abgefragt.length + ' Abfragen)');
    antworten['http://10.0.0.3:24690/info'] = { gid: 'ab', gen: 3 };
    antworten['http://10.0.0.2:24690/info'] = { gid: 'ab', gen: 3 };
    await warte(800);
    ok(treffer.length === 1 && treffer[0][0] === 'http://10.0.0.2:24690/' && treffer[0][1] === 3 && !rh.laeuft, 'Reihum: erster Treffer in Rangfolge (' + JSON.stringify(treffer) + ')');
    const nach = abgefragt.length;
    await warte(1200);
    ok(abgefragt.length === nach, 'Reihum: nach dem Treffer keine Abfragen mehr');
    rh.start(); rh.stop();
    await warte(800);
    ok(treffer.length === 1, 'Reihum: stop() verwirft eine laufende Runde');
    const leer = new M.Netz.Reihum({ fetch: fakeFetch });
    ok((await leer.pruefe()) === null, 'Reihum: ohne Liste nichts');
  }
  lauf().then(() => {}, e => fehler.push('Ausnahme: ' + (e && e.stack || e))).then(() => {
    const el = document.getElementById('autotest-result');
    el.setAttribute('data-ok', fehler.length ? '0' : '1');
    el.textContent = fehler.length ? 'FEHLER: ' + fehler.join(' | ') : 'ok';
  });
})();
</script></body></html>
